<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What’s new · Party Arcade</title>
  <meta name="description" content="Every Party Arcade update, newest first.">
  <meta name="theme-color" content="#0b0920">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .cl { max-width: 760px; margin: 0 auto; }
    .cl .page-head { text-align: center; margin-bottom: 18px; }
    .cl-list { position: relative; display: flex; flex-direction: column; gap: 14px; }
    .cl-entry { position: relative; }
    .cl-entry.latest { border-color: rgba(255, 79, 216, .5); background: linear-gradient(160deg, rgba(255,79,216,.12), rgba(34,211,238,.08)); }
    .cl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .cl-v { font-family: var(--font-display); font-size: .95rem; padding: 3px 10px; border-radius: 999px; background: rgba(34,211,238,.15); border: 1px solid rgba(34,211,238,.45); color: #a5f3fc; }
    .cl-date { margin-left: auto; font-size: .82rem; color: var(--muted); font-weight: 600; }
    .cl-entry h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.05rem, 3vw, 1.3rem); margin: 4px 0 8px; }
    .cl-entry ul { margin: 0; padding-left: 20px; }
    .cl-entry li { line-height: 1.55; margin-bottom: 3px; }
  </style>
</head>
<body>
  <main class="page cl" id="log"></main>
  <script src="/js/art.js"></script>
  <script src="/js/core.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/changelog.js"></script>
</body>
</html>
