<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halloween quests · Party Arcade</title>
  <meta name="description" content="Limited-time Halloween quests on Party Arcade: finish them all to unlock the Halloween theme.">
  <meta name="theme-color" content="#0b0920">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Creepster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('pa_theme')) || 'neon'; } catch (e) { /* storage blocked */ }</script>
  <style>
    .qp { width: min(1100px, 100%); }
    .q-hero { position: relative; overflow: hidden; margin: 6px 0 18px; padding: 26px 24px; border-radius: 28px; text-align: center;
      background: radial-gradient(circle at 12% 18%, rgba(255, 122, 26, .38), transparent 42%), radial-gradient(circle at 88% 12%, rgba(141, 255, 79, .14), transparent 40%),
        radial-gradient(circle at 70% 110%, rgba(139, 61, 255, .45), transparent 55%), linear-gradient(160deg, #1f0d2e, #0e0614 70%);
      border: 1px solid rgba(255, 140, 50, .45); box-shadow: var(--shadow), 0 0 60px -20px rgba(255, 122, 26, .5); color: #f8efff; }
    .q-hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 40% 40%, #fff6d8, #f4c96b 60%, transparent 62%); opacity: .2; filter: blur(1px); }
    .q-hero .q-e { font-size: 3.6rem; line-height: 1; display: inline-block; filter: drop-shadow(0 0 22px rgba(255, 130, 30, .8)); animation: an-float 2.6s ease-in-out infinite; }
    .q-hero h1 { font-family: "Creepster", var(--font-display); font-weight: 400; letter-spacing: .05em; font-size: clamp(2.4rem, 8vw, 4.2rem); margin: 6px 0 4px; color: #ffb36b;
      text-shadow: 0 0 24px rgba(255, 122, 26, .55), 0 4px 0 rgba(0, 0, 0, .4); }
    .q-hero p { color: #d8c4ea; max-width: 620px; margin: 0 auto; }
    .q-count { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .q-count div { min-width: 70px; padding: 8px 6px; border-radius: 14px; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 150, 70, .3); }
    .q-count b { display: block; font-family: "Bungee", var(--font); font-weight: 400; font-size: 1.5rem; color: #ffd9b0; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .q-count span { font-size: .72rem; color: #c9b3dd; text-transform: uppercase; letter-spacing: .08em; }
    .q-over { margin-top: 14px; font-weight: 700; color: #ffd9b0; }
    .q-total { margin: 18px auto 0; max-width: 460px; }
    .q-total .tt { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 6px; }
    .q-bar { height: 12px; border-radius: 999px; background: rgba(0, 0, 0, .4); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .6); }
    .q-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ff7a1a, #ffb52e 60%, #8dff4f); box-shadow: 0 0 12px rgba(255, 140, 40, .7); transition: width .6s; }

    .q-layout { display: grid; grid-template-columns: 1fr 340px; gap: 18px; align-items: start; }
    .q-guest { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; border-color: rgba(255, 140, 50, .45); }
    .q-guest .grow { min-width: 220px; }
    .q-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .quest { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 14px; border-radius: 20px; background: var(--panel); border: 1px solid var(--border); }
    .quest .qe { grid-row: span 2; width: 52px; height: 52px; display: grid; place-items: center; font-size: 1.9rem; border-radius: 16px; background: rgba(0, 0, 0, .25); }
    .quest h3 { font-size: 1.05rem; display: flex; align-items: center; gap: 6px; padding-right: 26px; }
    .quest .qd { font-size: .85rem; color: var(--muted); }
    .quest .qp-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .quest .qp-row .q-bar { flex: 1; height: 8px; }
    .quest .qn { font-weight: 700; font-variant-numeric: tabular-nums; font-size: .9rem; min-width: 44px; text-align: right; }
    .quest .qr { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: .78rem; }
    .quest .chip { padding: 3px 9px; border-radius: 999px; background: rgba(255, 122, 26, .16); border: 1px solid rgba(255, 140, 50, .4); font-weight: 700; color: var(--text); }
    .quest .chip.theme { background: rgba(139, 61, 255, .18); border-color: rgba(170, 120, 255, .45); }
    .quest .go { margin-left: auto; font-weight: 700; white-space: nowrap; }
    .quest .tick { position: absolute; top: 12px; right: 12px; font-size: 1.2rem; }
    .quest.done { border-color: rgba(141, 255, 79, .45); background: linear-gradient(160deg, rgba(141, 255, 79, .1), rgba(255, 122, 26, .06)); }
    .quest.done .q-bar i { background: linear-gradient(90deg, #4ade80, #8dff4f); }
    .quest.missed { opacity: .55; }

    .prize { position: sticky; top: 80px; text-align: center; padding: 16px; border-radius: 24px; overflow: hidden;
      background: linear-gradient(170deg, rgba(255, 122, 26, .16), rgba(139, 61, 255, .14) 60%, rgba(0, 0, 0, .1)); border: 1px solid rgba(255, 140, 50, .5); box-shadow: var(--shadow), 0 0 40px -16px rgba(255, 122, 26, .6); }
    .prize .pz-k { font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #ffb36b; }
    .prize h2 { font-family: "Creepster", var(--font-display); font-weight: 400; letter-spacing: .05em; font-size: 2rem; margin: 2px 0 10px; color: #ffd0a0; text-shadow: 0 0 18px rgba(255, 122, 26, .5); }
    .prize .theme-prev { border-radius: 16px; box-shadow: 0 16px 40px -18px rgba(0, 0, 0, .9); }
    .prize.locked .theme-prev { filter: saturate(.75) brightness(.8); }
    .prize .pz-lock { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.4rem; pointer-events: none; }
    .prize .pz-wrap { position: relative; }
    .prize p { margin: 12px 0; color: var(--muted); font-size: .9rem; }
    .prize .btn { width: 100%; }
    .prize.earned { border-color: rgba(141, 255, 79, .6); box-shadow: var(--shadow), 0 0 50px -14px rgba(141, 255, 79, .55); }
    .prize .pz-on { padding: 12px; border-radius: 16px; font-weight: 800; font-size: 1.1rem; color: #d9ffc2; background: rgba(74, 222, 128, .16); border: 1px solid rgba(141, 255, 79, .5); }
    .prize .pz-got { font-weight: 800; color: #b7ff8f; margin: 10px 0 0; }
    .q-tip { margin-top: 12px; font-size: .8rem; }
    .q-none { text-align: center; padding: 40px 16px; }
    @media (max-width: 900px) { .q-layout { grid-template-columns: 1fr; } .prize { position: static; order: -1; } }
    @media (max-width: 520px) { .q-hero { padding: 20px 14px; border-radius: 22px; } .q-count div { min-width: 60px; } .q-count b { font-size: 1.25rem; } .q-grid { grid-template-columns: 1fr; } }
    .calm .q-hero .q-e { animation: none; }
  </style>
</head>
<body>
  <main class="page qp" id="quests"></main>

  <script src="/js/art.js"></script>
  <script src="/js/core.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/quests.js"></script>
</body>
</html>
