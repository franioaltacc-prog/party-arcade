<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic 8-Ball · Party Arcade</title>
  <meta name="theme-color" content="#0b0920">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .eb { width: min(520px, 100%); margin: 10px auto; text-align: center; }
    .ball { position: relative; width: min(340px, 78vw); aspect-ratio: 1; margin: 10px auto 26px; border-radius: 50%; cursor: pointer;
      background: radial-gradient(circle at 32% 28%, #4b5563 0, #111827 32%, #000 70%); box-shadow: 0 30px 60px -20px rgba(139,92,246,.6), inset -18px -24px 40px rgba(0,0,0,.8), inset 10px 14px 30px rgba(255,255,255,.08); }
    .ball.shaking { animation: shake8 .9s ease-in-out; }
    @keyframes shake8 { 0%, 100% { transform: translate(0, 0) rotate(0); } 15% { transform: translate(-16px, 6px) rotate(-8deg); } 30% { transform: translate(14px, -8px) rotate(7deg); } 45% { transform: translate(-12px, -4px) rotate(-6deg); } 60% { transform: translate(10px, 8px) rotate(5deg); } 75% { transform: translate(-6px, -2px) rotate(-3deg); } }
    .window { position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, #1e1b4b, #020617 75%); box-shadow: inset 0 0 20px rgba(0,0,0,.9), 0 0 0 6px #1f2937; display: grid; place-items: center; overflow: hidden; }
    .eight { width: 70%; aspect-ratio: 1; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-family: var(--font-display); font-size: clamp(2.6rem, 9vw, 4.2rem); transition: opacity .3s; }
    .answer { position: absolute; inset: 12%; display: grid; place-items: center; text-align: center; color: #93c5fd; font-weight: 700; font-size: clamp(.8rem, 2.6vw, 1.05rem); line-height: 1.15; opacity: 0; transition: opacity 1.2s; text-shadow: 0 0 12px #3b82f6; }
    .answer::before { content: ""; position: absolute; inset: -6% 0 6%; background: #1d4ed8; clip-path: polygon(50% 100%, 0 8%, 100% 8%); opacity: .55; z-index: -1; }
    .show .answer { opacity: 1; }
    .show .eight { opacity: 0; }
    .ask { display: flex; gap: 10px; }
    .ask .input { flex: 1; }
    .history { margin-top: 22px; text-align: left; }
    .history div { padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.04); margin-bottom: 6px; font-size: .92rem; }
    @media (max-width: 520px) { .ask { flex-direction: column; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="eb">
      <h1 class="display" style="font-size:clamp(1.8rem,6vw,2.6rem);margin:6px 0 4px">Magic 8-Ball</h1>
      <p class="muted">Ask a yes-or-no question, then shake the ball.</p>
      <div class="ball" id="ball" title="Shake me!"><div class="window"><div class="eight">8</div><div class="answer" id="answer"></div></div></div>
      <form class="ask" id="ask" autocomplete="off"><input class="input" id="q" maxlength="120" placeholder="Will I win the next Neon Dash race?"><button class="btn btn-pink btn-lg" type="submit">🔮 Shake</button></form>
      <div class="history" id="history"></div>
    </div>
  </main>
  <script src="/js/art.js"></script>
  <script src="/js/core.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/fx.js"></script>
  <script>
  (() => {
    const { $, h, UI, Sfx, Net, rand } = PA;
    UI.topbar({ title: 'Magic 8-Ball', emoji: '🎱' });
    Net.connect();
    const YES = ['Absolutely, 100%!', 'The stars say YES ✨', 'Yep. Easy.', 'Without a doubt', 'Signs point to yes', 'Big yes energy'];
    const NO = ['Nope. Not today.', 'The vibes say no', 'Very doubtful', 'Ha! No.', 'My sources say no', 'Absolutely not 🙅'];
    const MAYBE = ['Ask again after a snack 🍪', 'Too foggy to tell…', 'Maybe? Probably? Who knows', 'Concentrate and ask again', 'The ball is napping 😴', 'Flip a coin instead 🪙'];
    let busy = false;
    function shake(e) {
      if (e) e.preventDefault();
      if (busy) return;
      const q = $('#q').value.trim();
      if (!q) { $('#q').focus(); UI.toast('Type a question first 🤔'); return; }
      busy = true;
      const ball = $('#ball');
      ball.classList.remove('show', 'shaking'); void ball.offsetWidth; ball.classList.add('shaking');
      Sfx.play('swoosh'); setTimeout(() => Sfx.play('swoosh'), 300);
      const pool = rand([YES, YES, NO, NO, MAYBE]);
      const ans = rand(pool);
      setTimeout(() => {
        $('#answer').textContent = ans;
        ball.classList.add('show');
        Sfx.play(pool === YES ? 'right' : pool === NO ? 'wrong' : 'pop');
        $('#history').prepend(h('div', {}, h('b', {}, q), h('br'), h('span', { class: 'muted' }, '🎱 ' + ans)));
        busy = false;
      }, 950);
    }
    $('#ask').addEventListener('submit', shake);
    $('#ball').addEventListener('click', () => shake());
  })();
  </script>
</body>
</html>
