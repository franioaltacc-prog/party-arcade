<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Flappy · Party Arcade</title>
  <meta name="theme-color" content="#0b0920">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .fl-wrap { width: min(1100px, 100%); margin: 0 auto; }
    .fl-stage { position: relative; width: 100%; height: clamp(420px, calc(100vh - 150px), 740px); height: clamp(420px, calc(100dvh - 150px), 740px); border-radius: 22px; overflow: hidden; background: #07041a; box-shadow: var(--shadow), 0 0 0 1px var(--border), 0 0 60px -20px rgba(255, 79, 216, .45); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
    .fl-stage canvas { display: block; width: 100%; height: 100%; }
    .fl-stage:fullscreen { height: 100%; border-radius: 0; }
    .fl-btns { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 3; }
    .fl-btns .icon-btn { width: 36px; height: 36px; background: rgba(11, 9, 32, .55); backdrop-filter: blur(4px); }
    .fl-hud { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 2; max-width: 46%; }
    .fl-chip { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 4px 11px; border-radius: 999px; background: rgba(11, 9, 32, .62); border: 1px solid rgba(255, 255, 255, .12); color: #fff; font-weight: 700; font-size: .85rem; white-space: nowrap; backdrop-filter: blur(4px); }
    .fl-chip.best { color: #fde68a; }
    .fl-board { display: flex; flex-direction: column; gap: 3px; }
    .fl-board div { display: flex; gap: 6px; align-items: center; padding: 2px 9px 2px 3px; border-radius: 999px; background: rgba(11, 9, 32, .6); color: #fff; font-weight: 600; font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fl-board div.me { background: rgba(250, 204, 21, .85); color: #1f1300; }
    .fl-board div.out { opacity: .55; text-decoration: line-through; }
    .fl-board i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
    .fl-board b { margin-left: auto; padding-left: 8px; font-variant-numeric: tabular-nums; }
    .fl-banner { position: absolute; left: 50%; top: 128px; transform: translateX(-50%); padding: 7px 16px; border-radius: 999px; background: rgba(11, 9, 32, .72); border: 1px solid rgba(255, 255, 255, .16); color: #fff; font-weight: 700; white-space: nowrap; pointer-events: none; z-index: 2; backdrop-filter: blur(4px); }
    .fl-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; padding: 16px; z-index: 2; }
    .fl-center .count { font-family: var(--font-display); font-size: clamp(4rem, 14vw, 8rem); color: #fff; text-shadow: 0 0 30px #ff4fd8, 0 0 60px rgba(34, 211, 238, .6), 0 4px 0 rgba(0, 0, 0, .35); }
    .fl-card { pointer-events: auto; cursor: default; width: min(400px, 100%); padding: 20px 20px 18px; border-radius: 24px; background: linear-gradient(170deg, rgba(36, 20, 84, .94), rgba(14, 9, 38, .96)); border: 1px solid rgba(255, 255, 255, .16); box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 79, 216, .25), 0 0 50px -10px rgba(255, 79, 216, .35); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .fl-card h2 { font-family: var(--font-display); font-weight: 400; margin: 0; font-size: clamp(1.5rem, 5vw, 1.9rem); letter-spacing: .02em; background: linear-gradient(90deg, #22d3ee, #ff4fd8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .fl-card .sub { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
    .fl-score { display: grid; grid-template-columns: auto 1fr 1fr; gap: 14px; align-items: center; margin: 16px 0 12px; padding: 12px 14px; border-radius: 18px; background: rgba(0, 0, 0, .28); border: 1px solid rgba(255, 255, 255, .08); }
    .fl-medal { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font-size: 2.6rem; background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .18), rgba(255, 255, 255, .03) 70%); border: 2px dashed rgba(255, 255, 255, .18); }
    .fl-medal.got { border: 2px solid rgba(250, 204, 21, .6); box-shadow: 0 0 24px rgba(250, 204, 21, .35); }
    .fl-medal .none { font-size: .72rem; color: var(--faint); font-weight: 700; line-height: 1.1; }
    .fl-num { text-align: left; }
    .fl-num small { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .fl-num b { font-family: var(--font-display); font-weight: 400; font-size: 2rem; line-height: 1.1; color: #fff; }
    .fl-new { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 999px; background: var(--pink); color: #fff; font-size: .62rem; vertical-align: middle; letter-spacing: .04em; }
    .fl-next { font-size: .85rem; color: var(--muted); margin-bottom: 12px; }
    .fl-skins { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; pointer-events: auto; }
    .fl-skin { position: relative; width: 66px; padding: 6px 4px 5px; border-radius: 16px; border: 2px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .05); color: var(--text); font: inherit; font-size: .68rem; font-weight: 700; cursor: pointer; display: grid; justify-items: center; gap: 1px; transition: transform .12s, border-color .2s, background .2s; }
    .fl-skin canvas { width: 46px; height: 46px; }
    .fl-skin:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--cyan); }
    .fl-skin.on { border-color: var(--yellow); background: rgba(250, 204, 21, .14); box-shadow: 0 0 16px rgba(250, 204, 21, .3); }
    .fl-skin:disabled { cursor: default; }
    .fl-skin.locked canvas { filter: grayscale(1) brightness(.45); }
    .fl-skin .lock { position: absolute; top: 14px; left: 0; right: 0; font-size: 1.1rem; }
    .fl-skin span { white-space: nowrap; }
    .fl-skin.locked span { color: var(--faint); }
    .fl-card .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
    .fl-rows { display: grid; gap: 5px; text-align: left; margin-top: 12px; }
    .fl-rows div { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 12px; background: rgba(255, 255, 255, .05); font-weight: 600; }
    .fl-rows div.me { background: rgba(250, 204, 21, .14); }
    .fl-rows .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fl-rows .pts { color: var(--lime); font-weight: 700; }
    .fl-ready { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 12px 16px; z-index: 2; pointer-events: none; background: linear-gradient(0deg, rgba(7, 4, 26, .78), rgba(7, 4, 26, 0)); }
    .fl-ready .best { color: #fde68a; font-weight: 700; font-size: .9rem; text-shadow: 0 1px 4px rgba(0, 0, 0, .7); }
    .fl-keys { margin-top: 10px; text-align: center; color: var(--muted); font-size: .85rem; }
    .round-seg { margin-bottom: 6px; }
    .fl-standings { margin-bottom: 14px; }
    #fly-chat { height: 280px; margin-top: 14px; }
    @media (max-width: 700px) {
      .fl-stage { height: clamp(420px, calc(100vh - 128px), 760px); height: clamp(420px, calc(100dvh - 128px), 760px); border-radius: 18px; }
      .fl-banner { top: 116px; font-size: .85rem; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
      .fl-board, .fl-chip.deco { display: none; }
      .fl-score { grid-template-columns: auto 1fr 1fr; gap: 10px; padding: 10px; }
      .fl-medal { width: 60px; height: 60px; font-size: 2.1rem; }
      .fl-num b { font-size: 1.6rem; }
      .fl-skin { width: 60px; }
      .fl-keys { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div id="entry"></div>
    <section id="room" class="hidden room-layout">
      <div class="col">
        <div class="panel" id="room-code"></div>
        <div class="panel" id="room-players"></div>
      </div>
      <div class="panel room-main" id="room-main"></div>
      <div class="panel chat-panel" id="room-chat"></div>
    </section>
    <section id="play" class="hidden fl-wrap">
      <div class="fl-stage" id="stage">
        <canvas id="cv" aria-label="Neon Flappy game"></canvas>
        <div class="fl-hud" id="hud"></div>
        <div class="fl-btns"><button class="icon-btn" id="btn-full" title="Full screen" aria-label="Full screen">⛶</button><button class="icon-btn" id="btn-quit" title="Back" aria-label="Back">✕</button></div>
        <div class="fl-banner hidden" id="banner"></div>
        <div class="fl-ready hidden" id="ready"></div>
        <div class="fl-center" id="center"></div>
      </div>
      <p class="fl-keys">Tap · click · Space · ↑ to flap &nbsp;·&nbsp; Enter to fly again</p>
      <div class="panel hidden" id="fly-chat"></div>
    </section>
  </main>
  <script src="/js/art.js"></script>
  <script src="/js/core.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/lobby.js"></script>
  <script src="/js/games/flappy-core.js"></script>
  <script src="/js/games/flappy.js"></script>
</body>
</html>
