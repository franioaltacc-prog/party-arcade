<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casino Night · Party Arcade</title>
  <meta name="theme-color" content="#0b0920">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root { --gold: #fbbf24; --felt: #0f5132; --felt-2: #166534; }
    .fake-note { display: inline-flex; gap: 6px; align-items: center; font-size: .8rem; color: var(--muted); }

    /* ---------- lobby ---------- */
    .set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
    .label-h { font-size: .74rem; font-weight: 700; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 6px; }
    .game-toggles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
    .gt { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 14px; border: 2px solid var(--border); background: rgba(255,255,255,.04); cursor: pointer; font-weight: 600; color: var(--text); text-align: left; }
    .gt.on { border-color: var(--gold); background: rgba(251,191,36,.1); }
    .gt:disabled { cursor: default; }
    .gt .e { font-size: 1.4rem; }
    .gt .badge { margin-left: auto; font-size: .6rem; }
    .vs-house { background: rgba(251,191,36,.16) !important; color: #fde68a !important; border-color: rgba(251,191,36,.45) !important; }
    .vs-players { background: rgba(244,63,94,.16) !important; color: #fecdd3 !important; border-color: rgba(244,63,94,.45) !important; }
    .num-in { width: 110px; padding: 8px 10px; }
    @media (max-width: 640px) { .set-grid { grid-template-columns: 1fr; } }

    /* ---------- results ---------- */
    .res-hero { text-align: center; padding: 10px 0 6px; }
    .res-hero .crown { font-size: 3rem; animation: bob 2.4s ease-in-out infinite; display: inline-block; }
    .res-hero h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 4vw, 2.4rem); }
    .res-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin: 16px 0; }
    .res-card { padding: 12px; border-radius: 18px; text-align: center; background: linear-gradient(160deg, rgba(251,191,36,.16), rgba(255,79,216,.1)); border: 1px solid rgba(251,191,36,.35); }
    .res-card .t { font-size: .74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .res-card .v { font-family: var(--font-display); font-size: 1.2rem; margin: 4px 0; }

    /* ---------- play layout ---------- */
    .casino-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
    .casino-grid > * { min-width: 0; }
    .menu { position: sticky; top: 76px; padding: 12px; }
    .menu h4 { font-size: .72rem; letter-spacing: .08em; color: var(--muted); margin: 8px 4px 6px; text-transform: uppercase; }
    .gbtn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-bottom: 6px; border-radius: 14px; border: 1px solid transparent; background: rgba(255,255,255,.04); color: var(--text); cursor: pointer; text-align: left; transition: background .15s, transform .1s; }
    .gbtn:hover { background: rgba(255,255,255,.09); transform: translateX(2px); }
    .gbtn.on { background: rgba(251,191,36,.14); border-color: rgba(251,191,36,.5); }
    .gbtn .e { font-size: 1.5rem; width: 30px; text-align: center; }
    .gbtn .t { font-weight: 700; font-size: .92rem; line-height: 1.1; }
    .gbtn .s { font-size: .74rem; color: var(--muted); }
    .match-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; padding: 12px 16px; }
    .my-coins { display: flex; align-items: center; gap: 10px; }
    .my-coins .coin { font-size: 2rem; animation: spin-y 4s linear infinite; display: inline-block; }
    @keyframes spin-y { 0%, 80% { transform: rotateY(0); } 100% { transform: rotateY(360deg); } }
    .my-coins .n { font-family: var(--font-display); font-size: 1.8rem; color: var(--gold); line-height: 1; transition: transform .2s; }
    .my-coins .n.up { animation: bump-up .6s; }
    .my-coins .n.down { animation: bump-down .6s; }
    @keyframes bump-up { 30% { transform: scale(1.18); color: var(--lime); } }
    @keyframes bump-down { 30% { transform: scale(.9); color: var(--red); } }
    .match-status { margin-left: auto; text-align: right; font-weight: 700; }
    .match-status .sub { font-size: .8rem; color: var(--muted); font-weight: 600; }
    .table-panel { min-height: 520px; }
    .table-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .table-head h2 { font-size: 1.4rem; display: flex; gap: 8px; align-items: center; }
    .banner { padding: 10px 14px; border-radius: 14px; margin-bottom: 12px; font-weight: 600; background: rgba(244,63,94,.14); border: 1px solid rgba(244,63,94,.4); }
    .banner.info { background: rgba(34,211,238,.12); border-color: rgba(34,211,238,.4); }

    .sb-row { display: grid; grid-template-columns: 22px auto 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 12px; margin-bottom: 6px; background: rgba(255,255,255,.04); transition: background .3s; }
    .sb-row.me { border: 1px solid rgba(251,191,36,.45); }
    .sb-row.out { opacity: .5; }
    .sb-row .nm { font-weight: 700; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-row .sub { font-size: .72rem; color: var(--muted); }
    .sb-row .c { font-family: var(--font-display); color: var(--gold); text-align: right; }
    .sb-row.flash-up { background: rgba(34,197,94,.25); }
    .sb-row.flash-down { background: rgba(244,63,94,.22); }
    .feed { max-height: 230px; overflow-y: auto; display: grid; gap: 6px; }
    .feed div { font-size: .84rem; padding: 6px 9px; border-radius: 10px; background: rgba(255,255,255,.04); animation: fade-in .3s; }
    #chat-box { height: 300px; }

    /* ---------- chips ---------- */
    .chips-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .chip-btn { --cc: #3b82f6; width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; color: #fff; font-weight: 800; font-size: .78rem;
      background: radial-gradient(circle, var(--cc) 52%, transparent 53%), repeating-conic-gradient(#fff 0 15deg, var(--cc) 15deg 30deg);
      box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .1s; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
    .chip-btn:hover { transform: translateY(-2px); }
    .chip-btn.on { transform: translateY(-4px) scale(1.08); box-shadow: 0 0 0 3px var(--gold), 0 6px 14px rgba(0,0,0,.4); }
    .chip-btn:disabled { opacity: .35; cursor: not-allowed; }
    .chip-mini { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 5px; border-radius: 99px; font-size: .68rem; font-weight: 800; color: #111; background: var(--gold); box-shadow: 0 2px 0 rgba(0,0,0,.35); }

    /* ---------- cards & dice ---------- */
    .pcard { width: 54px; height: 76px; border-radius: 8px; background: #fff; color: #111; display: inline-flex; flex-direction: column; justify-content: space-between; padding: 4px 6px; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,.35); position: relative; user-select: none; flex: none; }
    .pcard .r { font-size: 1.05rem; line-height: 1; }
    .pcard .s { font-size: 1.4rem; line-height: 1; align-self: center; }
    .pcard .r2 { transform: rotate(180deg); font-size: .8rem; align-self: flex-end; line-height: 1; }
    .pcard.red { color: #dc2626; }
    .pcard.back { background: repeating-linear-gradient(45deg, #7c3aed 0 6px, #6d28d9 6px 12px); border: 3px solid #fff; }
    .pcard.back > * { display: none; }
    .pcard.sm { width: 40px; height: 56px; padding: 3px 4px; }
    .pcard.sm .r { font-size: .85rem; } .pcard.sm .s { font-size: 1.05rem; } .pcard.sm .r2 { display: none; }
    .pcard.deal { animation: deal .45s cubic-bezier(.2,1.2,.4,1) backwards; }
    @keyframes deal { from { transform: translate(40px, -60px) rotate(25deg) scale(.6); opacity: 0; } }
    .pcard.win { box-shadow: 0 0 0 3px var(--gold), 0 0 18px var(--gold); }
    .cards { display: flex; gap: 6px; flex-wrap: wrap; min-height: 76px; }
    .die { width: 64px; height: 64px; border-radius: 14px; background: #fff; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 9px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.15), 0 6px 14px rgba(0,0,0,.35); flex: none; }
    .die i { width: 11px; height: 11px; border-radius: 50%; background: #111; place-self: center; }
    .die.sm { width: 40px; height: 40px; padding: 5px; border-radius: 9px; }
    .die.sm i { width: 7px; height: 7px; }
    .die.rolling { animation: tumble .25s linear infinite; }
    @keyframes tumble { 0% { transform: rotate(0) translateY(0); } 50% { transform: rotate(180deg) translateY(-8px); } 100% { transform: rotate(360deg) translateY(0); } }

    /* ---------- roulette ---------- */
    .rl-wrap { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 18px; align-items: start; }
    .wheel-box { position: relative; width: 100%; max-width: 280px; aspect-ratio: 1; margin: 0 auto; }
    .wheel-box canvas { width: 100%; height: 100%; }
    .wheel-box .pin { position: absolute; top: -4px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid var(--gold); filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
    .wheel-result { position: absolute; inset: 37%; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.6rem; color: #fff; }
    .rl-board { display: grid; grid-template-columns: 44px repeat(12, 1fr); gap: 3px; user-select: none; }
    .rl-cell { position: relative; min-height: 40px; border-radius: 6px; display: grid; place-items: center; font-weight: 800; font-size: .9rem; color: #fff; cursor: pointer; border: 1px solid rgba(255,255,255,.18); transition: filter .1s, transform .1s; }
    .rl-cell:hover { filter: brightness(1.25); transform: translateY(-1px); }
    .rl-cell.red { background: #b91c1c; } .rl-cell.black { background: #1f2937; } .rl-cell.green { background: #15803d; }
    .rl-cell.out { background: var(--felt); font-size: .78rem; }
    .rl-cell.hit { box-shadow: 0 0 0 3px var(--gold), 0 0 16px var(--gold); z-index: 1; }
    .rl-cell .chip-mini { position: absolute; top: -6px; right: -6px; z-index: 2; }
    .rl-zero { grid-row: span 3; }
    .rl-outs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-top: 3px; }
    .rl-dozens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 3px; margin-left: 47px; }
    .history { display: flex; gap: 5px; flex-wrap: wrap; }
    .history span { min-width: 28px; height: 28px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center; font-weight: 800; font-size: .8rem; color: #fff; }
    .h-red { background: #b91c1c; } .h-black { background: #1f2937; border: 1px solid rgba(255,255,255,.2); } .h-green { background: #15803d; }
    .status-line { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: rgba(0,0,0,.25); margin-bottom: 12px; flex-wrap: wrap; }
    .status-line .big { font-family: var(--font-display); font-size: 1.25rem; }
    .others { font-size: .82rem; color: var(--muted); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .others span { padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.05); }
    @media (max-width: 900px) { .rl-wrap { grid-template-columns: 1fr; } .rl-board { grid-template-columns: 34px repeat(12, 1fr); } .rl-cell { min-height: 32px; font-size: .72rem; } .rl-dozens { margin-left: 37px; } }

    /* ---------- dice ---------- */
    .dice-stage { display: flex; justify-content: center; gap: 18px; padding: 22px; border-radius: 22px; background: radial-gradient(circle, var(--felt-2), var(--felt)); margin-bottom: 14px; min-height: 120px; align-items: center; }
    .dice-total { font-family: var(--font-display); font-size: 2rem; color: #fff; min-width: 60px; text-align: center; }
    .dice-bets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .dice-sums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
    .bet-btn { position: relative; padding: 12px 8px; border-radius: 14px; border: 1px solid rgba(255,255,255,.2); background: var(--felt); color: #fff; cursor: pointer; font-weight: 800; text-align: center; transition: filter .1s, transform .1s; }
    .bet-btn:hover { filter: brightness(1.2); transform: translateY(-1px); }
    .bet-btn .pay { display: block; font-size: .72rem; font-weight: 600; color: #bbf7d0; }
    .bet-btn.hit { box-shadow: 0 0 0 3px var(--gold), 0 0 16px var(--gold); }
    .bet-btn .chip-mini { position: absolute; top: -8px; right: -6px; }
    @media (max-width: 640px) { .dice-bets { grid-template-columns: 1fr 1fr; } }

    /* ---------- blackjack ---------- */
    .felt { border-radius: 26px; padding: 18px; background: radial-gradient(ellipse at 50% 0%, var(--felt-2), var(--felt) 70%); border: 6px solid #3f2d14; box-shadow: inset 0 0 40px rgba(0,0,0,.4); }
    .bj-dealer { text-align: center; margin-bottom: 20px; }
    .bj-dealer .cards { justify-content: center; }
    .bj-label { font-weight: 700; color: #d1fae5; margin-bottom: 6px; font-size: .9rem; }
    .bj-hands { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .bj-hand { padding: 10px; border-radius: 16px; background: rgba(0,0,0,.22); border: 2px solid transparent; }
    .bj-hand.me { border-color: rgba(251,191,36,.6); }
    .bj-hand .who { display: flex; align-items: center; gap: 6px; font-weight: 700; margin-bottom: 6px; font-size: .9rem; }
    .bj-hand .cards { min-height: 56px; }
    .bj-res { display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 99px; font-weight: 800; font-size: .78rem; }
    .bj-res.win, .bj-res.blackjack { background: var(--green); } .bj-res.lose, .bj-res.bust { background: var(--red); } .bj-res.push { background: #64748b; }
    .bj-controls { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
    .turn-bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 6px; }
    .turn-bar i { display: block; height: 100%; background: var(--gold); transition: width .25s linear; }

    /* ---------- slots ---------- */
    .slot-machine { max-width: 460px; margin: 0 auto; padding: 18px; border-radius: 28px; background: linear-gradient(180deg, #7f1d1d, #450a0a); border: 6px solid var(--gold); box-shadow: 0 0 40px rgba(251,191,36,.3), inset 0 0 30px rgba(0,0,0,.5); text-align: center; }
    .slot-title { font-family: var(--font-display); color: var(--gold); font-size: 1.4rem; margin-bottom: 10px; text-shadow: 0 0 12px rgba(251,191,36,.7); }
    .reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; border-radius: 18px; background: #111; box-shadow: inset 0 6px 20px rgba(0,0,0,.8); }
    .reel { height: 110px; border-radius: 12px; background: linear-gradient(180deg, #e5e7eb, #fff 30%, #fff 70%, #d1d5db); display: grid; place-items: center; font-size: 3.4rem; overflow: hidden; }
    .reel.spinning span { animation: reel-blur .09s linear infinite; filter: blur(1.5px); }
    @keyframes reel-blur { from { transform: translateY(-30%); } to { transform: translateY(30%); } }
    .reel.stop span { animation: reel-stop .3s cubic-bezier(.2,1.6,.4,1); }
    @keyframes reel-stop { from { transform: translateY(-40%); } }
    .slot-win { min-height: 2.2em; margin: 12px 0; font-family: var(--font-display); font-size: 1.4rem; color: var(--gold); }
    .paytable { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin-top: 14px; font-size: .88rem; text-align: left; }
    .paytable div { display: flex; justify-content: space-between; padding: 3px 8px; border-radius: 8px; background: rgba(0,0,0,.25); }

    /* ---------- poker ---------- */
    .pk-table { position: relative; height: 500px; margin: 10px 0 18px; }
    .pk-felt { position: absolute; inset: 70px 70px 90px; border-radius: 50%; background: radial-gradient(ellipse, var(--felt-2), var(--felt) 70%); border: 10px solid #3f2d14; box-shadow: inset 0 0 50px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.4); display: grid; place-items: center; }
    .pk-center { text-align: center; }
    .pk-pot { font-family: var(--font-display); color: var(--gold); font-size: 1.2rem; margin-top: 8px; }
    .pk-street { font-size: .78rem; color: #d1fae5; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
    .pk-seat { position: absolute; width: 150px; transform: translate(-50%, -50%); text-align: center; padding: 8px; border-radius: 16px; background: rgba(11,9,32,.88); border: 2px solid var(--border); transition: border-color .2s, box-shadow .2s; }
    .pk-seat.turn { border-color: var(--gold); box-shadow: 0 0 22px rgba(251,191,36,.5); }
    .pk-seat.folded { opacity: .5; }
    .pk-seat.empty { background: rgba(255,255,255,.04); border-style: dashed; color: var(--faint); font-size: .85rem; }
    .pk-seat .nm { font-weight: 700; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pk-seat .co { font-size: .78rem; color: var(--gold); font-weight: 700; }
    .pk-seat .cards { justify-content: center; min-height: 0; margin: 4px 0; }
    .pk-seat .act { font-size: .74rem; color: var(--muted); min-height: 1em; }
    .pk-seat .bet { position: absolute; left: 50%; transform: translateX(-50%); bottom: -14px; }
    .pk-btn { position: absolute; top: -10px; right: -10px; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #111; font-weight: 900; font-size: .75rem; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
    .pk-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; padding: 12px; border-radius: 18px; background: rgba(0,0,0,.25); }
    .pk-raise { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pk-raise input[type=range] { width: 160px; accent-color: var(--gold); }
    .pk-win { text-align: center; padding: 10px; border-radius: 14px; background: rgba(251,191,36,.14); border: 1px solid rgba(251,191,36,.45); margin-bottom: 10px; font-weight: 700; }
    @media (max-width: 760px) { .pk-table { height: 520px; } .pk-felt { inset: 90px 10px; } .pk-seat { width: 118px; padding: 6px; } .pk-seat .pcard.sm { width: 32px; height: 46px; } }

    /* ---------- duels ---------- */
    .duel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .duel-arena { min-height: 200px; border-radius: 22px; background: radial-gradient(circle, var(--felt-2), var(--felt)); display: grid; place-items: center; padding: 18px; text-align: center; margin-bottom: 14px; }
    .vs-row { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
    .vs-side { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 110px; font-weight: 700; }
    .vs-side.won .avatar { box-shadow: 0 0 0 4px var(--gold), 0 0 24px var(--gold); }
    .coin3d { width: 110px; height: 110px; position: relative; transform-style: preserve-3d; }
    .coin3d .f { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.1rem; color: #422006; background: radial-gradient(circle at 35% 30%, #fef3c7, #fbbf24 55%, #b45309); border: 4px solid #fde68a; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .coin3d .f.tails { transform: rotateY(180deg); }
    .coin3d.flip { animation: coinflip var(--dur, 3s) cubic-bezier(.2,.8,.3,1) forwards; }
    @keyframes coinflip { from { transform: rotateY(0) translateY(0); } 50% { transform: rotateY(calc(var(--turns) * .5)) translateY(-40px); } to { transform: rotateY(var(--turns)) translateY(0); } }
    .duel-list .row-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 14px; background: rgba(255,255,255,.05); margin-bottom: 7px; flex-wrap: wrap; }
    .opp-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .opp-list button { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 99px; border: 2px solid var(--border); background: rgba(255,255,255,.05); color: var(--text); cursor: pointer; font-weight: 600; }
    .opp-list button.on { border-color: var(--gold); background: rgba(251,191,36,.12); }
    @media (max-width: 760px) { .duel-grid { grid-template-columns: 1fr; } }

    @media (max-width: 1150px) { .casino-grid { grid-template-columns: 200px minmax(0, 1fr); } .casino-grid .side { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; } }
    @media (max-width: 820px) {
      .casino-grid { grid-template-columns: 1fr; }
      .menu { position: static; display: flex; gap: 6px; overflow-x: auto; padding: 8px; }
      .menu h4 { display: none; }
      .gbtn { width: auto; flex: none; margin: 0; }
      .gbtn .s { display: none; }
      .casino-grid .side { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div id="entry"></div>

    <section id="room" class="hidden room-layout">
