<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Would You Rather · Party Arcade</title>
  <meta name="theme-color" content="#0b0920">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .wyr { width: min(900px, 100%); margin: 0 auto; }
    .wyr h1 { text-align: center; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 5vw, 2.6rem); margin: 6px 0 18px; }
    .split { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .side { position: relative; overflow: hidden; min-height: 280px; border: 0; border-radius: 26px; padding: 26px; color: #fff; cursor: pointer; text-align: center; display: grid; place-items: center;
      font-size: clamp(1.15rem, 3vw, 1.6rem); font-weight: 700; box-shadow: inset 0 -8px 0 rgba(0,0,0,.25); transition: transform .15s, filter .2s; }
    .side:hover:not(:disabled) { transform: translateY(-4px) rotate(-.5deg); filter: brightness(1.08); }
    .side:disabled { cursor: default; }
    .side.a { background: linear-gradient(160deg, #fb7185, #e11d48); }
    .side.b { background: linear-gradient(160deg, #60a5fa, #2563eb); }
    .side .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.22); transition: height .9s cubic-bezier(.2,1,.3,1); }
    .side .txt { position: relative; z-index: 1; }
    .side .pct { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 7vw, 3.4rem); display: block; margin-top: 10px; }
    .side.mine { box-shadow: inset 0 -8px 0 rgba(0,0,0,.25), 0 0 0 4px #fff; }
    .or { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; width: 64px; height: 64px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-family: var(--font-display); box-shadow: 0 8px 20px rgba(0,0,0,.4); pointer-events: none; }
    .wyr-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; flex-wrap: wrap; }
    @media (max-width: 640px) { .split { grid-template-columns: 1fr; } .side { min-height: 170px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="wyr">
      <h1>Would you rather…</h1>
      <div class="split" id="split"></div>
      <div class="wyr-foot"><span class="muted small" id="info"></span><button class="btn btn-yellow btn-lg" id="next">Next question ➜</button></div>
    </div>
  </main>
  <script src="/js/art.js"></script>
  <script src="/js/core.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/fx.js"></script>
  <script>
  (() => {
    const { $, h, fill, UI, Sfx, store, Net } = PA;
    UI.topbar({ title: 'Would You Rather', emoji: '🤔' });
    const Q = [
      ['Be able to fly 🦅', 'Be invisible 👻'], ['Only eat pizza forever 🍕', 'Never eat pizza again 😱'], ['Have a pet dragon 🐉', 'Have a pet unicorn 🦄'],
      ['Live in a treehouse 🌳', 'Live in a submarine 🌊'], ['Talk to animals 🐶', 'Speak every human language 🌍'], ['Be a famous YouTuber 🎥', 'Be a pro athlete 🏆'],
      ['Have no homework ever 📚', 'Have no chores ever 🧹'], ['Time travel to the past ⏪', 'Time travel to the future ⏩'], ['Be super strong 💪', 'Be super fast ⚡'],
      ['Never use a phone again 📵', 'Never watch TV again 📺'], ['Have a robot butler 🤖', 'Have a personal chef 👨‍🍳'], ['Explore space 🚀', 'Explore the deep ocean 🐙'],
      ['Always be 10 minutes late ⏰', 'Always be 20 minutes early 🕰️'], ['Have hiccups forever 😖', 'Feel like sneezing forever 🤧'], ['Be a wizard 🧙', 'Be a superhero 🦸'],
      ['Live without music 🎵', 'Live without movies 🎬'], ['Have a rewind button ⏮️', 'Have a pause button ⏸️'], ['Be the best at video games 🎮', 'Be the best at sports ⚽'],
      ['Eat a bug 🐛', 'Lick a sidewalk 🛣️'], ['Have a lifetime supply of candy 🍬', 'A lifetime supply of ice cream 🍦'], ['Be a giant 🦕', 'Be tiny like an ant 🐜'],
      ['Live in Minecraft ⛏️', 'Live in Roblox 🧱'], ['Win the lottery 💰', 'Live twice as long ⏳'], ['Read minds 🧠', 'See the future 🔮'],
      ['Have 3 eyes 👀', 'Have 3 arms 💪'], ['Always smell like cheese 🧀', 'Always smell like fish 🐟'], ['Go to school on the moon 🌕', 'Go to school underwater 🫧'],
      ['Never be cold again 🥶', 'Never be hot again 🥵'], ['Be friends with a ghost 👻', 'Be friends with an alien 👽'], ['Only whisper 🤫', 'Only shout 📢'],
      ['Have wheels instead of feet 🛼', 'Have wings but can’t fly 🪽'], ['Be the funniest person 😂', 'Be the smartest person 🧠'], ['Live in a castle 🏰', 'Live on a private island 🏝️'],
      ['Ride a dinosaur 🦖', 'Ride a giant eagle 🦅'], ['Have unlimited Robux 💎', 'Have unlimited V-Bucks 🪙'], ['Teleport anywhere 🌀', 'Be able to stop time ⏱️'],
      ['Sneeze glitter ✨', 'Burp bubbles 🫧'], ['Have a personal theme song 🎶', 'Have a personal narrator 🎙️'], ['Never sleep 😳', 'Sleep 20 hours a day 😴'],
      ['Be a cat 🐱', 'Be a dog 🐶'],
    ];
    let answered = store.get('wyr_done', []);
    let order = Q.map((_, i) => i).filter((i) => !answered.includes(i)).sort(() => Math.random() - 0.5);
    let cur = null;

    function show() {
      if (!order.length) { answered = []; store.set('wyr_done', []); order = Q.map((_, i) => i).sort(() => Math.random() - 0.5); }
      cur = order.shift();
      const [a, b] = Q[cur];
      fill($('#split'),
        h('button', { class: 'side a', onclick: () => vote(0) }, h('div', { class: 'fill' }), h('div', {}, h('span', { class: 'txt' }, a), h('span', { class: 'pct hidden' }))),
        h('div', { class: 'or' }, 'OR'),
        h('button', { class: 'side b', onclick: () => vote(1) }, h('div', { class: 'fill' }), h('div', {}, h('span', { class: 'txt' }, b), h('span', { class: 'pct hidden' }))));
      $('#info').textContent = `Question ${Q.length - order.length} of ${Q.length} · votes come from everyone on this server`;
      $('#next').classList.add('hidden');
    }
    function vote(choice) {
      if ($('.side').disabled) return;
      document.querySelectorAll('.side').forEach((s) => { s.disabled = true; });
      document.querySelectorAll('.side')[choice].classList.add('mine');
      Sfx.play('pop');
      Net.send('wyr:vote', { q: String(cur), choice });
      answered.push(cur); store.set('wyr_done', answered);
    }
    Net.on('wyr:result', (m) => {
      if (String(cur) !== m.q) return;
      const total = m.votes[0] + m.votes[1] || 1;
      document.querySelectorAll('.side').forEach((s, i) => {
        const pct = Math.round(m.votes[i] / total * 100);
        const el = s.querySelector('.pct');
        el.classList.remove('hidden');
        let n = 0; const t = setInterval(() => { n = Math.min(pct, n + Math.ceil(pct / 20) || 1); el.textContent = n + '%'; if (n >= pct) clearInterval(t); }, 30);
        s.querySelector('.fill').style.height = (100 - pct) + '%';
      });
      $('#info').textContent = `${m.votes[0] + m.votes[1]} vote${m.votes[0] + m.votes[1] === 1 ? '' : 's'} so far · ${m.votes[m.mine] / total >= 0.5 ? 'You’re with the crowd! 🙌' : 'You’re a rebel! 😎'}`;
      $('#next').classList.remove('hidden');
    });
    $('#next').addEventListener('click', () => { Sfx.play('swoosh'); show(); });
    Net.connect();
    show();
  })();
  </script>
</body>
</html>
