<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impostor · Party Arcade</title>
  <meta name="theme-color" content="#0b0920">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .imp-grid { display: grid; grid-template-columns: 230px minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
    .imp-grid > * { min-width: 0; }
    .imp-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .imp-bar { padding: 12px 16px; }
    .imp-bar-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .imp-bar-top #round { font-weight: 700; color: var(--muted); white-space: nowrap; }
    .imp-bar-top #phase-label { flex: 1; text-align: center; font-family: var(--font-display); font-size: clamp(1rem, 2.6vw, 1.35rem); }
    .imp-bar .clock { font-family: var(--font-display); font-size: 1.25rem; min-width: 56px; text-align: center; padding: 4px 10px; border-radius: 12px; background: var(--panel-2); }
    .imp-bar .clock.low { background: rgba(244,63,94,.3); color: #ffd1da; }
    .tbar { height: 8px; border-radius: 999px; background: rgba(0,0,0,.35); overflow: hidden; }
    .tbar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink)); transition: width .2s linear; }
    .tbar.low i { background: linear-gradient(90deg, var(--orange), var(--red)); }

    /* role card */
    .role-wrap { perspective: 1000px; }
    .role-card { position: relative; border-radius: 24px; padding: 18px 20px; text-align: center; cursor: pointer; user-select: none; overflow: hidden;
      border: 2px solid var(--rc); background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 30%, #120e2e), #120e2e 75%);
      box-shadow: 0 0 40px -10px var(--rc), var(--shadow); transform-style: preserve-3d; }
    .role-card.crew { --rc: #22d3ee; }
    .role-card.imp { --rc: #f43f5e; }
    .role-card.spec { --rc: #8b5cf6; }
    .role-card .rc-top { font-weight: 700; color: var(--muted); font-size: .95rem; }
    .role-card .rc-big { font-family: var(--font-display); font-size: clamp(1.8rem, 6vw, 3rem); line-height: 1.05; margin: 6px 0; overflow-wrap: anywhere; }
    .role-card.crew .rc-big { color: #a5f3fc; text-shadow: 0 0 24px rgba(34,211,238,.6); }
    .role-card.imp .rc-big { color: #fda4af; text-shadow: 0 0 24px rgba(244,63,94,.7); }
    .role-card .rc-cat { display: inline-flex; gap: 6px; align-items: center; padding: 5px 12px; border-radius: 999px; background: rgba(0,0,0,.3); font-weight: 700; }
    .role-card .rc-tip { margin-top: 10px; font-size: .88rem; color: var(--muted); }
    .role-card .rc-cover { position: absolute; inset: 0; display: none; place-items: center; background: #141033; font-weight: 700; font-size: 1.1rem; color: var(--muted); }
    .role-card.hid .rc-cover { display: grid; }
    .role-card .rc-hide { position: absolute; top: 10px; right: 12px; font-size: .75rem; color: var(--faint); }

    /* stage */
    #stage { min-height: 120px; }
    .stage-center { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 8px 0; }
    .stage-center .big { font-family: var(--font-display); font-size: clamp(1.2rem, 3.6vw, 1.8rem); }
    .clue-form { display: flex; gap: 10px; width: 100%; max-width: 520px; }
    .clue-form .input { font-size: 1.15rem; font-weight: 700; text-align: center; }
    .thinking .avatar { animation: bob 1.4s ease-in-out infinite; }
    .vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; width: 100%; }
    .vote-btn { display: grid; justify-items: center; gap: 6px; padding: 12px 8px; border-radius: 18px; border: 2px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; font-weight: 700; transition: transform .12s, border-color .2s, background .2s; }
    .vote-btn:hover:not(:disabled) { transform: translateY(-2px); background: var(--panel-2); }
    .vote-btn.on { border-color: var(--pink); background: rgba(255,79,216,.18); box-shadow: 0 0 20px -6px var(--pink); }
    .vote-btn .vn { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vote-btn .vt { font-size: .72rem; color: var(--muted); font-weight: 600; }
    .vote-btn.skip { border-style: dashed; }
    .result-head { font-family: var(--font-display); font-size: clamp(1.4rem, 4.5vw, 2.2rem); }
    .result-head.crew { color: #a5f3fc; }
    .result-head.imp { color: #fda4af; }
    .reveal-imps { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .reveal-imps .who { display: grid; justify-items: center; gap: 4px; font-weight: 700; }
    .word-reveal { font-family: var(--font-display); font-size: clamp(1.4rem, 4vw, 2rem); color: var(--yellow); }
    .tally { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .tally .tchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: var(--panel-2); font-weight: 700; font-size: .88rem; }
    .tally .tchip.out { background: rgba(244,63,94,.25); box-shadow: 0 0 0 2px rgba(244,63,94,.6); }
    .gains { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .gains span { padding: 4px 10px; border-radius: 999px; background: rgba(34,197,94,.18); color: #bbf7d0; font-weight: 700; font-size: .85rem; }

    /* clue board */
    .clue-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: rgba(255,255,255,.04); margin-bottom: 7px; border: 2px solid transparent; }
    .clue-row.turn { border-color: rgba(250,204,21,.6); background: rgba(250,204,21,.08); }
    .clue-row.imp { border-color: rgba(244,63,94,.6); background: rgba(244,63,94,.1); }
    .clue-row .cn { font-weight: 700; width: 110px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clue-row .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; margin: 0; }
    .clue-chip { padding: 5px 11px; border-radius: 12px; background: rgba(34,211,238,.16); border: 1px solid rgba(34,211,238,.4); font-weight: 700; overflow-wrap: anywhere; }
    .clue-chip.none { background: transparent; border-style: dashed; border-color: var(--border); color: var(--faint); font-weight: 600; }
    .clue-chip.wait { background: rgba(250,204,21,.12); border-color: rgba(250,204,21,.45); color: #fde68a; }
    .clue-row .tag { margin-left: auto; font-size: .75rem; font-weight: 700; white-space: nowrap; }

    .score-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: rgba(255,255,255,.04); margin-bottom: 7px; }
    .score-row.me { border: 1px solid rgba(250,204,21,.35); }
    .score-row .pts { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
    .spec-note { margin-top: 10px; padding: 10px; border-radius: 14px; background: rgba(139,92,246,.15); font-size: .85rem; color: var(--muted); }
    #play-chat { height: 620px; }

    /* lobby settings */
    .imp-set { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .cat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .cat-chip { border: 1px solid var(--border); background: var(--panel); color: var(--muted); padding: 7px 11px; border-radius: 999px; cursor: pointer; font-weight: 600; }
    .cat-chip.on { background: rgba(34,197,94,.2); border-color: rgba(34,197,94,.55); color: var(--text); }
    .cat-chip:disabled { cursor: default; }
    @media (max-width: 1100px) { .imp-grid { grid-template-columns: minmax(0, 1fr) 300px; } .imp-grid .imp-scores { grid-column: 1 / -1; order: 3; } }
    @media (max-width: 760px) { .imp-grid { grid-template-columns: 1fr; } #play-chat { height: 360px; } .imp-set { grid-template-columns: 1fr; } .clue-row .cn { width: 80px; } }
  </style>
</head>
<body>
  <main class="page">
    <div id="entry"></div>
    <section id="room" class="hidden room-layout">
      <div class="col">
        <div class="panel" id="room-code"></div>
        <div class="panel" id="room-players"></div>
      </div>
      <div class="panel room-main" id="room-main"></div>
      <div class="panel chat-panel" id="room-chat"></div>
    </section>
    <section id="play" class="hidden imp-grid">
      <aside class="panel imp-scores"><div class="panel-title">🏆 Points</div><div id="scores"></div><div id="spec-note"></div></aside>
      <div class="imp-main">
        <div class="panel imp-bar">
          <div class="imp-bar-top"><span id="round"></span><span id="phase-label"></span><span class="clock" id="clock">--</span></div>
          <div class="tbar" id="tbar-wrap"><i id="tbar"></i></div>
        </div>
        <div class="role-wrap" id="role"></div>
        <div class="panel" id="stage"></div>
        <div class="panel" id="clues"></div>
      </div>
      <div class="panel" id="play-chat"></div>
    </section>
  </main>
  <script src="/js/art.js"></script>
  <script src="/js/core.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/lobby.js"></script>
  <script src="/js/games/impostor.js"></script>
</body>
</html>
