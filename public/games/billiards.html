<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billiards · Party Arcade</title>
  <meta name="description" content="8-ball and 9-ball pool with friends or against the computer: real rolling balls, spin, and a proper shot clock.">
  <meta name="theme-color" content="#050b1c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('pa_theme')) || 'blue'; } catch (e) { /* storage blocked */ }</script>
  <style>
    /* ---------- play screen ---------- */
    #play { --felt: #1f7a4a; }
    .bl-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
    .bl-grid.solo { grid-template-columns: minmax(0, 1fr); }
    .bl-grid.solo .bl-side { display: none; }
    .bl-game { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .bl-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .bl-side .chat-panel { height: 420px; }

    /* player cards */
    .bl-top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: stretch; }
    .bl-card { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 18px; min-width: 0;
      background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.025)); border: 2px solid var(--border); transition: border-color .25s, box-shadow .25s, opacity .25s; }
    .bl-card.right { flex-direction: row-reverse; text-align: right; padding: 8px 8px 8px 12px; }
    .bl-card.turn { border-color: var(--c, var(--yellow)); box-shadow: 0 0 26px -6px var(--c, var(--yellow)), inset 0 0 0 1px rgba(255,255,255,.06); }
    .bl-card.dim { opacity: .62; }
    .bl-av { position: relative; flex: none; width: 50px; height: 50px; display: grid; place-items: center; }
    .bl-av .avatar { width: 40px; height: 40px; font-size: 1.3rem; }
    .bl-av svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
    .bl-av svg circle { fill: none; stroke-width: 4; }
    .bl-av svg .bg { stroke: rgba(255,255,255,.08); }
    .bl-av svg .fg { stroke: var(--lime); stroke-linecap: round; transition: stroke .3s; }
    .bl-av svg .fg.warn { stroke: var(--orange); }
    .bl-av svg .fg.hot { stroke: var(--red); }
    .bl-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .bl-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bl-sub { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; display: flex; align-items: center; gap: 4px; }
    .bl-card.right .bl-sub { justify-content: flex-end; }
    .bl-sub img.mb, .bl-tray img.mb, .bl-mid img.mb { width: 16px; height: 16px; display: inline-block; vertical-align: middle; flex: none; }
    .bl-sub img.mb.gone { opacity: .2; filter: grayscale(1); }
    .bl-score { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; min-width: 28px; text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
    .bl-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 10px; text-align: center; }
    .bl-mid .race { font-family: var(--font-display); font-size: .78rem; color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
    .bl-mid .mode { font-weight: 700; font-size: .95rem; white-space: nowrap; display: flex; gap: 4px; align-items: center; }
    .bl-mid .clock { font-family: var(--font-display); font-size: 1rem; font-variant-numeric: tabular-nums; }
    .bl-mid .timer { font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .bl-top.single { grid-template-columns: minmax(0, 340px) auto; justify-content: center; }

    /* the table */
    .bl-tablerow { display: flex; gap: 10px; align-items: stretch; justify-content: center; }
    .bl-stage { position: relative; flex: none; border-radius: 26px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .bl-stage canvas { display: block; width: 100%; height: 100%; border-radius: inherit; cursor: crosshair; }
    .bl-stage.idle canvas { cursor: default; }
    .bl-stage.grab canvas { cursor: grab; }
    .bl-stage.grabbing canvas { cursor: grabbing; }
    .bl-status { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 5px 14px; border-radius: 999px; background: rgba(8,6,24,.62); color: #fff; font-weight: 700; font-size: .9rem;
      white-space: nowrap; pointer-events: none; box-shadow: 0 6px 18px -8px rgba(0,0,0,.7); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(4px); max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; transition: opacity .25s; }
    .bl-status:empty { opacity: 0; }
    .bl-overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; padding: 14px; }
    .bl-overlay .card { pointer-events: auto; max-width: min(440px, 94%); padding: 18px 22px; border-radius: 24px; text-align: center; background: linear-gradient(170deg, rgba(36,29,87,.96), rgba(20,16,51,.96));
      border: 1px solid var(--border-strong); box-shadow: 0 30px 60px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04) inset; }
    .bl-overlay .card h2 { font-family: var(--font-display); font-weight: 400; margin: 0 0 6px; font-size: clamp(1.3rem, 4.5vw, 1.9rem); }
    .bl-overlay .card .big { font-family: var(--font-display); font-size: clamp(1.8rem, 7vw, 2.8rem); margin: 6px 0; }
    .bl-overlay .card p { margin: 4px 0; color: var(--muted); }
    .bl-overlay .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

    /* power slider (pull down and let go) */
    .bl-power { flex: none; width: 54px; display: flex; flex-direction: column; align-items: center; gap: 6px; touch-action: none; user-select: none; -webkit-user-select: none; }
    .bl-power .lbl { font-family: var(--font-display); font-size: .62rem; color: var(--muted); letter-spacing: .08em; }
    .bl-ptrack { position: relative; flex: 1; width: 40px; border-radius: 20px; cursor: ns-resize; overflow: hidden;
      background: linear-gradient(90deg, #120e2b, #1e1846 50%, #120e2b); border: 1px solid var(--border-strong); box-shadow: inset 0 4px 14px rgba(0,0,0,.6); }
    .bl-ptrack .fill { position: absolute; left: 4px; right: 4px; top: 4px; height: 0; border-radius: 16px;
      background: linear-gradient(180deg, #22c55e, #facc15 55%, #f43f5e); box-shadow: 0 0 18px rgba(250,204,21,.45); }
    .bl-ptrack .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(180deg, transparent 0 9.5%, rgba(255,255,255,.12) 9.5% 10%); pointer-events: none; }
    .bl-ptrack .cue { position: absolute; left: 50%; width: 12px; margin-left: -6px; top: -60%; height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, #8a5a2b, #f3d9a4 45%, #b07a3c); box-shadow: 0 2px 6px rgba(0,0,0,.6); pointer-events: none; }
    .bl-ptrack .cue::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; border-radius: 0 0 6px 6px; background: linear-gradient(180deg, #f8f4ea 0 50%, #2a6ad6 50%); }
    .bl-ptrack .mark { position: absolute; left: 0; right: 0; height: 2px; background: rgba(255,255,255,.7); box-shadow: 0 0 6px #fff; pointer-events: none; opacity: .0; }
    .bl-power .pct { font-family: var(--font-display); font-size: .8rem; font-variant-numeric: tabular-nums; min-height: 1.1em; }
    .bl-power.off { opacity: .35; pointer-events: none; }

    /* under the table: spin, fine aim, tray, tools */
    .bl-under { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .bl-spin { flex: none; width: 64px; height: 64px; border-radius: 50%; cursor: pointer; touch-action: none; position: relative; box-shadow: 0 8px 18px -8px rgba(0,0,0,.8); }
    .bl-spin canvas { width: 100%; height: 100%; display: block; border-radius: 50%; }
    .bl-spin.off { opacity: .4; pointer-events: none; }
    .bl-spinpop { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,6,24,.55); border-radius: inherit; z-index: 5; touch-action: none; }
    .bl-spinpop .box { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; border-radius: 22px; background: rgba(20,16,51,.95); border: 1px solid var(--border-strong); }
    .bl-spinpop canvas { width: min(200px, 46vmin); height: min(200px, 46vmin); border-radius: 50%; touch-action: none; cursor: crosshair; }
    .bl-fine { position: relative; flex: 1 1 160px; max-width: 320px; min-width: 120px; height: 44px; border-radius: 14px; cursor: ew-resize; touch-action: none; overflow: hidden;
      background: linear-gradient(180deg, #2a2155, #17123a); border: 1px solid var(--border-strong); box-shadow: inset 0 3px 10px rgba(0,0,0,.6); }
    .bl-fine .ridges { position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.0) 0 6px, rgba(255,255,255,.16) 6px 8px, rgba(0,0,0,.25) 8px 10px); }
    .bl-fine::after { content: "◀  fine aim  ▶"; position: absolute; inset: 0; display: grid; place-items: center; font-size: .72rem; font-weight: 700; letter-spacing: .08em; color: rgba(255,255,255,.75); text-shadow: 0 1px 3px #000; pointer-events: none; }
    .bl-fine::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(23,18,58,1), transparent 30%, transparent 70%, rgba(23,18,58,1)); z-index: 1; pointer-events: none; }
    .bl-fine.off { opacity: .4; pointer-events: none; }
    .bl-tray { position: relative; flex: 1 1 260px; max-width: 420px; height: 34px; border-radius: 17px; padding: 0 10px; display: flex; align-items: center; gap: 2px; overflow: hidden;
      background: linear-gradient(180deg, #2b1608, #4a2a12 40%, #2b1608); box-shadow: inset 0 3px 8px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.08); }
    .bl-tray::before { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 22px; margin-top: -11px; border-radius: 11px; background: rgba(0,0,0,.4); box-shadow: inset 0 2px 5px rgba(0,0,0,.8); }
    .bl-tray img.mb { position: relative; width: 22px; height: 22px; transition: transform .7s cubic-bezier(.2,.8,.3,1.1), opacity .3s; }
    .bl-tray img.mb.in { transform: translateX(380px) rotate(720deg); opacity: 0; }
    .bl-tray .empty { position: relative; font-size: .72rem; color: rgba(255,255,255,.4); font-weight: 600; margin: 0 auto; }
    .bl-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .bl-tools .icon-btn { width: 40px; height: 40px; }
    .felt-pick { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .felt-pick button { width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: inset 0 -6px 10px rgba(0,0,0,.35), 0 4px 10px -4px #000; }
    .felt-pick button.on { border-color: #fff; box-shadow: 0 0 0 3px var(--pink), inset 0 -6px 10px rgba(0,0,0,.35); }
    .bl-help { text-align: center; color: var(--muted); font-size: .8rem; margin: 0; }
    .bl-think { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(8,6,24,.7); color: #e9e5ff; font-size: .85rem; font-weight: 600; pointer-events: none;
      opacity: 0; transition: opacity .3s; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
    .bl-think.on { opacity: 1; }
    .bl-soloBar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .bl-soloBar .grow { flex: 1; }
    .bl-timer { font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; padding: 4px 12px; border-radius: 12px; background: rgba(0,0,0,.3); }

    /* solo menu + lobby settings */
    .bl-menu { width: min(900px, 100%); margin: 0 auto; }
    .bl-modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .bl-mode { text-align: left; padding: 16px; border-radius: 20px; border: 2px solid var(--border); background: var(--panel); color: var(--text); display: flex; flex-direction: column; gap: 10px; }
    .bl-mode .e { font-size: 2.2rem; line-height: 1; }
    .bl-mode b { font-size: 1.15rem; }
    .bl-mode p { margin: 0; color: var(--muted); font-size: .88rem; flex: 1; }
    .bl-mode .seg { align-self: flex-start; }
    .bl-mode .best { font-size: .82rem; color: var(--yellow); font-weight: 600; }
    .set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .bl-seats { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 4px 0 16px; }
    .bl-seat { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px dashed var(--border-strong); min-width: 0; }
    .bl-seat.full { border-style: solid; }
    .bl-seat .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bl-vs { font-family: var(--font-display); color: var(--muted); }

    @media (max-width: 1100px) { .bl-grid { grid-template-columns: minmax(0, 1fr); } .bl-side { display: grid; grid-template-columns: 1fr 1fr; } .bl-side .chat-panel { height: 320px; } }
    @media (max-width: 760px) {
      .bl-modes, .set-grid { grid-template-columns: 1fr; }
      .bl-side { grid-template-columns: 1fr; }
      #play.page-tight { margin: -12px -8px 0; }
      .bl-top { gap: 6px; }
      .bl-card { padding: 5px 8px 5px 5px; gap: 6px; border-radius: 14px; }
      .bl-card.right { padding: 5px 5px 5px 8px; }
      .bl-av { width: 40px; height: 40px; }
      .bl-av .avatar { width: 31px; height: 31px; font-size: 1rem; }
      .bl-name { font-size: .85rem; }
      .bl-sub { font-size: .7rem; min-height: 14px; gap: 2px; }
      .bl-sub img.mb { width: 11px; height: 11px; }
      .bl-sub.balls { flex-wrap: wrap; white-space: normal; overflow: visible; row-gap: 1px; max-width: 64px; }
      .bl-card.right .bl-sub.balls { margin-left: auto; }
      .bl-score { font-size: 1.25rem; min-width: 18px; }
      .bl-mid { padding: 2px; }
      .bl-mid .mode { font-size: .75rem; }
      .bl-mid .race { font-size: .62rem; }
      .bl-mid .timer { font-size: 1.15rem; }
      .bl-power { width: 44px; }
      .bl-ptrack { width: 34px; }
      .bl-under { gap: 8px; }
      .bl-spin { width: 52px; height: 52px; }
      .bl-fine { height: 40px; }
      .bl-tray { height: 28px; flex-basis: 100%; max-width: none; order: 5; }
      .bl-tray img.mb { width: 18px; height: 18px; }
      .bl-status { font-size: .78rem; top: 6px; }
      .bl-help { display: none; }
    }
    @media (max-height: 519px) and (orientation: landscape) { .bl-help { display: none; } .bl-under { gap: 8px; } .bl-spin { width: 52px; height: 52px; } .bl-fine { height: 40px; }
      /* phones on their side: the header scrolls away so the player cards stay readable above the table */
      body.bl-playing .topbar { position: relative; }
      .bl-game { gap: 6px; }
      .bl-top { gap: 6px; }
      .bl-card { padding: 3px 8px 3px 4px; gap: 6px; border-radius: 14px; }
      .bl-card.right { padding: 3px 4px 3px 8px; }
      .bl-av { width: 38px; height: 38px; }
      .bl-av .avatar { width: 30px; height: 30px; font-size: 1rem; }
      .bl-name { font-size: .85rem; }
      .bl-sub { font-size: .7rem; min-height: 14px; }
      .bl-score { font-size: 1.3rem; }
      .bl-mid { padding: 0 6px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div id="entry"></div>

    <section id="menu" class="hidden bl-menu"></section>

    <section id="room" class="hidden room-layout">
      <div class="col">
        <div class="panel" id="room-code"></div>
        <div class="panel" id="room-players"></div>
      </div>
      <div class="panel room-main" id="room-main"></div>
      <div class="panel chat-panel" id="room-chat"></div>
    </section>

    <section id="play" class="hidden">
      <div class="bl-grid" id="bl-grid">
        <div class="bl-game">
          <div class="bl-soloBar hidden" id="solo-bar"></div>
          <div class="bl-top">
            <div class="bl-card" id="card0"></div>
            <div class="bl-mid" id="bl-mid"></div>
            <div class="bl-card right" id="card1"></div>
          </div>
          <div class="bl-tablerow">
            <div class="bl-stage" id="stage">
              <canvas id="cv" aria-label="Pool table"></canvas>
              <div class="bl-status" id="status"></div>
              <div class="bl-think" id="think"></div>
              <div class="bl-overlay" id="overlay"></div>
            </div>
            <div class="bl-power" id="power" title="Pull down and let go to shoot">
              <span class="lbl">POWER</span>
              <div class="bl-ptrack" id="ptrack"><div class="ticks"></div><div class="fill" id="pfill"></div><div class="mark" id="pmark"></div><div class="cue" id="pcue"></div></div>
              <span class="pct" id="ppct"></span>
            </div>
          </div>
          <div class="bl-under">
            <div class="bl-spin" id="spin" title="Spin: where the cue tip hits the cue ball (double-click to reset)"><canvas id="spin-cv"></canvas></div>
            <div class="bl-fine" id="fine" title="Drag for fine aim"><div class="ridges" id="ridges"></div></div>
            <div class="bl-tray" id="tray"></div>
            <div class="bl-tools" id="tools"></div>
          </div>
          <p class="bl-help" id="help">Move the mouse to aim · drag back from the cue ball (or pull the power bar) and let go to shoot · ← → or the wheel for fine aim · set spin on the white ball</p>
        </div>
        <aside class="bl-side" id="bl-side">
          <div class="panel" id="play-players"></div>
          <div class="panel chat-panel" id="play-chat"></div>
        </aside>
      </div>
    </section>
  </main>
  <script src="/js/art.js"></script>
  <script src="/js/core.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/lobby.js"></script>
  <script src="/js/games/pool-core.js"></script>
  <script src="/js/games/pool-ai.js"></script>
  <script src="/js/games/billiards.js"></script>
</body>
</html>
