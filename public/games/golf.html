<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Golf · Party Arcade</title>
  <meta name="theme-color" content="#0b0920">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .gf-wrap { width: min(1200px, 100%); margin: 0 auto; }
    .gf-stage { position: relative; width: 100%; height: clamp(380px, calc(100vh - 128px), 880px); border-radius: 22px; overflow: hidden; background: #10243a; box-shadow: var(--shadow), 0 0 0 1px var(--border); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    @supports (height: 100svh) { .gf-stage { height: clamp(380px, calc(100svh - 128px), 880px); } }
    .gf-stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    .gf-stage canvas.aim { cursor: crosshair; }
    .gf-stage:fullscreen { height: 100%; border-radius: 0; }
    .gf-stage .hud { position: absolute; pointer-events: none; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.45); }
    .gf-hole { top: 12px; left: 14px; }
    .gf-hole .n { font-family: var(--font-display); font-size: clamp(1.5rem, 4.4vw, 2.5rem); line-height: 1; letter-spacing: .02em; }
    .gf-hole .n small { font-size: .5em; opacity: .75; margin-left: 4px; }
    .gf-hole .name { font-weight: 700; font-size: clamp(.85rem, 2.4vw, 1.05rem); margin-top: 2px; }
    .gf-hole .par { display: inline-flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .gf-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: rgba(9, 14, 30, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-weight: 700; font-size: .85rem; text-shadow: none; border: 1px solid rgba(255,255,255,.14); }
    .gf-chip.hot { background: rgba(250, 204, 21, .9); color: #1f1300; border-color: transparent; }
    .gf-chip.warn { background: rgba(244, 63, 94, .88); border-color: transparent; }
    .gf-strokes { display: inline-flex; gap: 3px; align-items: center; }
    .gf-strokes i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.25); display: inline-block; }
    .gf-strokes i.on { background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.7); }
    .gf-strokes i.over { background: #fb7185; }
    .gf-top { top: 10px; right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .gf-btns { display: flex; gap: 6px; pointer-events: auto; }
    .gf-btns .icon-btn { width: 38px; height: 38px; background: rgba(9, 14, 30, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #fff; border-color: rgba(255,255,255,.18); font-size: 1rem; }
    .gf-btns .icon-btn.on { background: rgba(250, 204, 21, .9); color: #1f1300; }
    .gf-total { text-align: right; }
    .gf-total .big { font-family: var(--font-display); font-size: clamp(1.3rem, 3.6vw, 2rem); line-height: 1; }
    .gf-total .sub { font-weight: 700; font-size: .8rem; opacity: .85; }
    .gf-board { top: 118px; left: 12px; display: flex; flex-direction: column; gap: 4px; max-width: 46%; }
    .gf-board div { display: flex; gap: 6px; align-items: center; padding: 3px 10px 3px 4px; border-radius: 999px; background: rgba(9, 14, 30, .55); font-weight: 600; font-size: .8rem; text-shadow: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gf-board div.me { background: rgba(250, 204, 21, .85); color: #1f1300; }
    .gf-board div.done { opacity: .75; }
    .gf-board i { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
    .gf-board b { margin-left: auto; padding-left: 6px; font-variant-numeric: tabular-nums; }
    .gf-power { left: 50%; bottom: 18px; transform: translateX(-50%); width: min(340px, 70%); opacity: 0; transition: opacity .15s; }
    .gf-power.on { opacity: 1; }
    .gf-power .lbl { display: flex; justify-content: space-between; font-weight: 700; font-size: .85rem; margin-bottom: 4px; }
    .gf-power .bar { height: 14px; border-radius: 999px; background: rgba(9, 14, 30, .6); border: 1px solid rgba(255,255,255,.25); overflow: hidden; }
    .gf-power .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #4ade80, #facc15 55%, #f43f5e); background-size: 340px 100%; }
    .gf-hint { left: 50%; bottom: 16px; transform: translateX(-50%); text-align: center; font-weight: 700; font-size: .9rem; padding: 7px 14px; border-radius: 999px; background: rgba(9, 14, 30, .5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); text-shadow: none; transition: opacity .3s; white-space: nowrap; max-width: 94%; overflow: hidden; text-overflow: ellipsis; }
    .gf-hint.off { opacity: 0; }
    .gf-hurry { top: 14px; left: 50%; transform: translateX(-50%); }
    .gf-banner { inset: 0; display: grid; place-items: center; text-align: center; }
    .gf-banner .t { font-family: var(--font-display); font-size: clamp(2.2rem, 9vw, 5.2rem); line-height: 1; color: var(--bc, #fff); text-shadow: 0 6px 0 rgba(0,0,0,.28), 0 0 40px color-mix(in srgb, var(--bc, #fff) 60%, transparent); -webkit-text-stroke: 2px rgba(0,0,0,.25); }
    .gf-banner .s { font-weight: 700; font-size: clamp(1rem, 3vw, 1.4rem); margin-top: 8px; }
    .gf-intro { inset: 0; display: grid; place-items: start center; padding-top: max(96px, 16%); text-align: center; }
    .gf-intro .k { font-weight: 700; letter-spacing: .3em; font-size: .9rem; opacity: .9; }
    .gf-intro .t { font-family: var(--font-display); font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1.05; }
    .gf-intro .p { display: inline-block; margin-top: 8px; padding: 4px 16px; border-radius: 999px; background: rgba(250, 204, 21, .92); color: #1f1300; font-family: var(--font-display); font-size: 1.2rem; text-shadow: none; }
    .gf-intro .tip { margin-top: 10px; font-weight: 600; font-size: clamp(.9rem, 2.5vw, 1.05rem); max-width: 520px; padding: 0 16px; }
    .gf-center { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px; pointer-events: none; }
    .gf-center .count { font-family: var(--font-display); font-size: clamp(4rem, 14vw, 8rem); color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 40px rgba(255,255,255,.4); }
    .gf-card { pointer-events: auto; width: min(620px, 100%); max-height: 100%; overflow: auto; padding: 18px; border-radius: 22px; background: color-mix(in srgb, var(--panel-solid) 94%, transparent); border: 1px solid var(--border-strong); box-shadow: var(--shadow); color: var(--text); text-align: center; }
    .gf-card h2 { font-family: var(--font-display); font-weight: 400; margin: 0 0 2px; font-size: clamp(1.3rem, 4vw, 1.8rem); }
    .gf-card .sub { color: var(--muted); font-weight: 600; margin-bottom: 10px; }
    .gf-card .big { font-family: var(--font-display); font-size: clamp(2.2rem, 8vw, 3.4rem); line-height: 1.1; }
    .gf-card .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .gf-card .rows { display: grid; gap: 4px; text-align: left; margin-top: 10px; }
    .gf-card .rows > div { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 12px; background: rgba(255,255,255,.05); font-weight: 600; }
    .gf-card .rows > div.me { background: rgba(250, 204, 21, .14); }
    .gf-card .rows .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-scroll { overflow-x: auto; margin: 8px -4px 0; padding: 0 4px 4px; }
    table.sc { border-collapse: separate; border-spacing: 3px; margin: 0 auto; font-variant-numeric: tabular-nums; font-size: .9rem; }
    table.sc th, table.sc td { min-width: 28px; height: 30px; padding: 2px 4px; border-radius: 8px; text-align: center; font-weight: 700; }
    table.sc th { color: var(--muted); font-weight: 600; font-size: .78rem; }
    table.sc td.nm { text-align: left; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
    table.sc tr.par td { color: var(--muted); font-weight: 600; }
    table.sc td.s { background: rgba(255,255,255,.07); }
    table.sc td.ace { background: linear-gradient(135deg, #fde047, #f59e0b); color: #1f1300; }
    table.sc td.eagle { background: rgba(34, 211, 238, .35); }
    table.sc td.birdie { background: rgba(163, 230, 53, .3); }
    table.sc td.bogey { background: rgba(251, 146, 60, .22); }
    table.sc td.dbl { background: rgba(244, 63, 94, .28); }
    table.sc td.cur { outline: 2px solid var(--yellow); }
    table.sc td.tot { background: rgba(139, 92, 246, .3); min-width: 40px; }
    .gf-keys { margin-top: 10px; text-align: center; color: var(--muted); font-size: .85rem; }
    .menu-head { text-align: center; margin-bottom: 16px; }
    .courses { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    .course-card { position: relative; overflow: hidden; text-align: left; padding: 0; border-radius: 22px; border: 2px solid var(--border); background: var(--panel); color: var(--text); font: inherit; display: flex; flex-direction: column; transition: transform .15s, border-color .2s; }
    .course-card:hover { transform: translateY(-3px); border-color: var(--cyan); }
    .course-card.on { border-color: var(--yellow); }
    .course-card .art { height: 150px; position: relative; display: grid; place-items: center; font-size: 4rem; overflow: hidden; }
    .course-card .art.classic { background: radial-gradient(ellipse 34% 16% at 66% 80%, #8be070 0 70%, #6cc95c 71% 100%, transparent 100%), radial-gradient(ellipse 70% 40% at 15% 100%, #5cb94a 0 99%, transparent 100%), radial-gradient(ellipse 60% 34% at 92% 92%, #4fae45 0 99%, transparent 100%), radial-gradient(circle at 18% 22%, #ffffffcc 0 5%, transparent 6%), radial-gradient(circle at 24% 20%, #ffffffcc 0 6%, transparent 7%), linear-gradient(180deg, #4aa8f5 0%, #bfe6ff 58%, #74c862 58.5%, #5fb64f 100%); }
    .course-card .art.spooky { background: radial-gradient(circle at 80% 24%, #fff6c9 0 9%, rgba(255,246,201,.22) 10%, transparent 22%), radial-gradient(ellipse 70% 40% at 12% 100%, #24452f 0 99%, transparent 100%), radial-gradient(ellipse 60% 36% at 90% 98%, #1c3626 0 99%, transparent 100%), radial-gradient(ellipse 40% 10% at 50% 62%, rgba(185,166,255,.25), transparent), linear-gradient(180deg, #07031a 0%, #3b1a5c 58%, #2a4a36 58.5%, #162b1f 100%); }
    .course-card .art.random { background: conic-gradient(from 0deg, #5fb8ff, #a3e635, #facc15, #fb923c, #8b5cf6, #5fb8ff); }
    .course-card .art span { filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
    .course-card .art .flag { position: absolute; right: 18%; bottom: 30%; font-size: 2.6rem; }
    .course-card .body { padding: 14px 16px 16px; display: grid; gap: 6px; }
    .course-card .body b { font-size: 1.25rem; }
    .course-card .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
    .course-card .meta span { padding: 2px 9px; border-radius: 999px; background: var(--panel-2); }
    .course-card .play { margin-top: 4px; }
    .course-card:disabled { cursor: default; transform: none; }
    .practice { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
    .practice button { width: 34px; height: 30px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; }
    .practice button:hover { border-color: var(--cyan); }
    .practice button.got { border-color: rgba(163, 230, 53, .6); }
    .set-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    #play-chat { height: 300px; margin-top: 14px; }
    @media (pointer: coarse) { .gf-keys { display: none; } }
    @media (max-width: 600px) {
      .gf-stage { border-radius: 16px; height: clamp(380px, calc(100svh - 112px), 880px); }
      .gf-board { top: 104px; }
      .gf-hint { font-size: .78rem; bottom: 12px; }
      .gf-btns .icon-btn { width: 34px; height: 34px; }
      table.sc { font-size: .8rem; }
      table.sc th, table.sc td { min-width: 22px; height: 26px; padding: 1px 2px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div id="entry"></div>
    <section id="room" class="hidden room-layout">
      <div class="col">
        <div class="panel" id="room-code"></div>
        <div class="panel" id="room-players"></div>
      </div>
      <div class="panel room-main" id="room-main"></div>
      <div class="panel chat-panel" id="room-chat"></div>
    </section>
    <section id="menu" class="hidden gf-wrap"></section>
    <section id="play" class="hidden gf-wrap">
      <div class="gf-stage" id="stage">
        <div class="hud gf-hole"><div class="n" id="hole-n">HOLE 1</div><div class="name" id="hole-name"></div><div class="par" id="hole-par"></div></div>
        <div class="hud gf-top">
          <div class="gf-btns">
            <button class="icon-btn" id="btn-view" title="Look at the whole hole (V)" aria-label="Overview">🗺️</button>
            <button class="icon-btn" id="btn-full" title="Full screen" aria-label="Full screen">⛶</button>
            <button class="icon-btn" id="btn-quit" title="Back" aria-label="Back">✕</button>
          </div>
          <div class="gf-total" id="total"></div>
        </div>
        <div class="hud gf-board" id="board"></div>
        <div class="hud gf-hurry" id="hurry"></div>
        <div class="hud gf-power" id="power"><div class="lbl"><span>Power</span><span id="power-pct">0%</span></div><div class="bar"><i id="power-bar"></i></div></div>
        <div class="hud gf-hint off" id="hint"></div>
        <div class="hud gf-intro" id="intro"></div>
        <div class="hud gf-banner" id="banner"></div>
        <div class="gf-center" id="center"></div>
      </div>
      <p class="gf-keys">🖱️ Drag back from the ball to aim, let go to shoot · drag anywhere else to look around · scroll to zoom · V overview · ⌨️ ← → aim, ↑ ↓ power, Space shoot</p>
      <div class="panel hidden" id="play-chat"></div>
    </section>
  </main>
  <script src="/js/art.js"></script>
  <script src="/js/core.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/lobby.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/js/games/golf-core.js"></script>
  <script src="/js/games/golf.js"></script>
</body>
</html>
