<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Motocross · Party Arcade</title>
  <meta name="description" content="Motocross: realistic 3D dirt bikes with huge jumps, flips and nitro. Ride solo time trials or race your friends online on Party Arcade.">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Kanit:ital,wght@0,400;0,600;1,600;1,800;1,900&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('pa_theme')) || 'blue'; } catch (e) { /* storage blocked */ }</script>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
  <style>
    /* The whole game lives in one full-window "game screen": the 3D track is always behind, and the menus,
       the garage and the online room sit on top of it (like Cork7). While you ride, the menus make way for the HUD. */
    body.mx-page { overflow: hidden; }
    body.mx-page .topbar, body.mx-page .site-footer, body.mx-page .news { display: none !important; }
    .mx-app { --ink: #15171c; --paper: #f3f0e8; --glass: rgba(13, 19, 31, .7); --line: rgba(255,255,255,.13); --hi: #c6f432;
      --marker: 'Permanent Marker', 'Kanit', cursive; --kanit: 'Kanit', var(--font);
      position: fixed; inset: 0; z-index: 60; overflow: hidden; color: #fff; font-family: var(--kanit);
      background: radial-gradient(ellipse at 70% 30%, #33496b, #0b1220 70%); touch-action: manipulation; }
    #mx-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .mx-shade { position: absolute; inset: 0; pointer-events: none; transition: opacity .4s;
      background: linear-gradient(90deg, rgba(8,12,20,.62) 0, rgba(8,12,20,.32) 34%, rgba(8,12,20,0) 58%), linear-gradient(0deg, rgba(8,12,20,.55), rgba(8,12,20,0) 26%), linear-gradient(180deg, rgba(8,12,20,.5), rgba(8,12,20,0) 18%); }
    .mx-app.riding .mx-shade, .mx-app.riding .mx-ui { opacity: 0; visibility: hidden; pointer-events: none; }
    .mx-app:not(.riding) .mx-hud, .mx-app:not(.riding) .mx-btns, .mx-app:not(.riding) .mx-touch, .mx-app:not(.riding) #hud-center { display: none !important; }
    .mx-app.riding { touch-action: none; user-select: none; -webkit-user-select: none; }

    /* ---------------------------------------------------------------- menus */
    .mx-ui { position: absolute; inset: 0; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; transition: opacity .35s, visibility .35s;
      padding: max(14px, env(safe-area-inset-top)) max(clamp(14px, 3vw, 40px), env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(clamp(14px, 3vw, 40px), env(safe-area-inset-left)); }
    .mx-top { display: flex; align-items: center; gap: 12px; }
    .mx-logo { display: grid; line-height: .9; text-decoration: none !important; color: #fff; }
    .mx-logo small { font: 600 .62rem var(--kanit); letter-spacing: .32em; opacity: .75; }
    .mx-logo b { font: italic 900 clamp(1.5rem, 3vw, 2.1rem) var(--kanit); letter-spacing: .01em; text-shadow: 0 3px 14px rgba(0,0,0,.35); }
    .mx-logo b i { color: #ff7a1a; font-style: italic; }
    .mx-icons { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .mx-ib, .mx-icons .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--glass); color: #fff; font-size: 1.05rem; cursor: pointer; text-decoration: none !important; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); position: relative; }
    .mx-ib:hover, .mx-icons .icon-btn:hover { background: rgba(30,40,60,.85); }
    .mx-icons .profile-chip { height: 40px; border-radius: 10px; background: var(--glass); border-color: var(--line); color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding-left: 6px; }
    .mx-icons .profile-chip:hover { background: rgba(30,40,60,.85); }
    .mx-icons .fr-badge { position: absolute; top: -5px; right: -5px; }
    .mx-tabs { display: flex; gap: clamp(14px, 2.4vw, 30px); margin: clamp(10px, 2.4vh, 22px) 0 clamp(10px, 2vh, 16px); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; }
    .mx-tabs::-webkit-scrollbar { display: none; }
    .mx-tab { display: flex; align-items: center; gap: 7px; padding: 0 0 10px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: none; color: #fff; opacity: .72; font: 1.02rem var(--marker); white-space: nowrap; cursor: pointer; }
    .mx-tab:hover { opacity: 1; }
    .mx-tab.on { opacity: 1; border-bottom-color: #fff; }
    .mx-tab .ph { font-size: 1.1rem; }
    .mx-tab .new { font: 700 .58rem var(--kanit); letter-spacing: .08em; padding: 1px 6px; border-radius: 5px; background: #fff; color: var(--ink); }
    .mx-screen { flex: 1 0 auto; display: flex; gap: 16px; min-height: 0; align-items: flex-start; }
    .mx-col { width: min(440px, 100%); display: grid; gap: 12px; align-content: start; }
    /* screens with long lists use more of the screen (in grids) instead of one long column */
    .mx-col.mid { width: min(560px, 100%); }
    .mx-col.wide { width: min(900px, 66vw); }
    .mx-wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
    .mx-wgrid .mx-card2 { min-height: 84px; padding: 34px 12px 10px; }
    .mx-wgrid .mx-card2 b { font-size: clamp(1.05rem, 1.6vw, 1.35rem); }
    .mx-chsplit { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 12px; align-items: start; }
    .mx-chpick { display: grid; gap: 10px; position: sticky; top: 8px; }
    .mx-chdetail { display: grid; gap: 4px; }
    .mx-chdetail .e { font-size: 2.2rem; line-height: 1; }
    .mx-chdetail b { font: 1.6rem var(--marker); text-transform: uppercase; line-height: 1.05; }
    .mx-chdetail small { font: 600 .78rem var(--kanit); opacity: .85; }
    .mx-chdetail p { margin: 6px 0 4px; font-size: .86rem; line-height: 1.35; opacity: .92; }
    .mx-chdetail .best { justify-self: start; font: 600 .78rem var(--kanit); padding: 3px 9px; border-radius: 7px; background: rgba(255,255,255,.12); }
    .mx-chlist.grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
    .mx-chlist.grid .mx-chal { padding: 8px 12px; }
    .mx-chlist.grid .mx-chal .e { font-size: 1.4rem; }
    .mx-chlist.grid .mx-chal b { font-size: 1.02rem; }
    .mx-foot { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-top: 16px; font-size: .78rem; opacity: .8; }
    .mx-foot a { color: #fff; }
    .mx-foot a:first-child { font-weight: 600; }

    .mx-back { justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; color: #fff; font: 1.6rem var(--marker); text-transform: uppercase; cursor: pointer; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
    .mx-back span { font: 700 .65rem var(--kanit); letter-spacing: .08em; padding: 2px 6px; border: 1.5px solid rgba(255,255,255,.7); border-radius: 6px; }
    .mx-back:hover { transform: translateX(-2px); }

    /* big colourful cards with sun rays, like Cork7's mode cards */
    .mx-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mx-card2 { --c1: #2f6bff; --c2: #1d3fcf; position: relative; display: grid; align-content: end; gap: 2px; min-height: 92px; padding: 36px 14px 12px; border-radius: 14px; border: 3px solid transparent; text-align: left; color: #fff; cursor: pointer; overflow: hidden;
      background: repeating-conic-gradient(from 0deg at 78% 135%, rgba(255,255,255,.075) 0 5deg, transparent 5deg 11deg), linear-gradient(135deg, var(--c1), var(--c2));
      box-shadow: 0 5px 0 rgba(0,0,0,.28), 0 14px 30px -14px rgba(0,0,0,.7); transition: transform .12s, border-color .15s; font: inherit; }
    .mx-card2:hover { transform: translateY(-2px); }
    .mx-card2:active { transform: translateY(2px); }
    .mx-card2.on { border-color: #fff; }
    .mx-card2 .ic { position: absolute; top: 10px; left: 12px; font-size: 1.15rem; }
    .mx-card2 b { font: clamp(1.25rem, 3.6vw, 1.7rem) var(--marker); text-transform: uppercase; line-height: 1.05; text-shadow: 0 2px 0 rgba(0,0,0,.18); }
    .mx-card2 small { font-size: .74rem; opacity: .88; line-height: 1.25; }
    .mx-card2.wide { min-height: 76px; }
    .mx-card2.blue { --c1: #2f6bff; --c2: #1d3fcf; }
    .mx-card2.purple { --c1: #9246ff; --c2: #6224d6; }
    .mx-card2.red { --c1: #ff4a5e; --c2: #c81e3a; }
    .mx-card2.green { --c1: #34b36f; --c2: #1d7f4d; }
    .mx-card2.orange { --c1: #ff8a2a; --c2: #d4520f; }
    .mx-sticker { position: absolute; top: 9px; right: 9px; display: inline-flex; gap: 4px; align-items: center; padding: 2px 9px; border-radius: 6px; background: var(--hi); color: #13210a; font: .72rem var(--marker); transform: rotate(-3deg); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
    .mx-sticker.gold { background: #ffd21a; color: #2b1d00; }
    .mx-sticker.dark { background: rgba(0,0,0,.4); color: #fff; box-shadow: none; }

    /* the white "rider licence" ticket and the big white buttons */
    .mx-ticket { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 24px; border-radius: 14px; background: var(--paper); color: var(--ink); box-shadow: 0 5px 0 rgba(0,0,0,.28), 0 14px 30px -14px rgba(0,0,0,.7); }
    .mx-ticket::before { content: ""; position: absolute; left: 9px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--ink); }
    .mx-ticket .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .mx-ticket .lab { font: .78rem var(--marker); letter-spacing: .04em; text-transform: uppercase; }
    .mx-ticket .nm { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px dashed rgba(21,23,28,.25); padding-bottom: 3px; }
    .mx-ticket .nm small { font: 700 .62rem var(--kanit); letter-spacing: .12em; opacity: .55; }
    .mx-ticket .nm b { font: 1.3rem var(--marker); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .mx-ticket .xp { height: 5px; border-radius: 9px; background: rgba(21,23,28,.12); overflow: hidden; margin-top: 4px; }
    .mx-ticket .xp i { display: block; height: 100%; background: linear-gradient(90deg, #ff7a1a, #ffd21a); }
    .mx-ticket .acts { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 3px; }
    .mx-link { padding: 0; border: 0; background: none; color: var(--ink); font: 700 .72rem var(--kanit); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; text-decoration: none !important; }
    .mx-link:hover { text-decoration: underline !important; }
    .mx-barcode { flex: none; width: 40px; height: 54px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 3px, var(--ink) 3px 4px, transparent 4px 6px, var(--ink) 6px 9px, transparent 9px 10px); }
    .mx-code-big { font: 2.4rem var(--marker); letter-spacing: .14em; line-height: 1; }

    .mx-go { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 20px; border: 0; border-radius: 14px; background: var(--paper); color: var(--ink); cursor: pointer; text-align: left;
      box-shadow: 0 5px 0 rgba(0,0,0,.3), 0 16px 34px -14px rgba(0,0,0,.75); transition: transform .1s, background .2s; font: inherit; }
    .mx-go:hover { transform: translateY(-2px); }
    .mx-go:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
    .mx-go b { flex: 1; min-width: 0; font: clamp(1.5rem, 4.6vw, 2.1rem) var(--marker); text-transform: uppercase; line-height: 1.05; }
    .mx-go b small { display: block; font: 600 .74rem var(--kanit); letter-spacing: .06em; text-transform: none; opacity: .7; margin-top: 2px; }
    .mx-go .arr { font: 900 1.6rem var(--kanit); }
    .mx-go.on { background: var(--hi); }
    .mx-go.slim { padding: 12px 16px; }
    .mx-go.slim b { font-size: 1.3rem; }
    .mx-go:disabled { opacity: .55; cursor: default; transform: none; }
    .mx-key { flex: none; padding: 1px 7px; border: 2px solid currentColor; border-radius: 7px; font: 700 .66rem var(--kanit); letter-spacing: .08em; }

    /* glass panels */
    .mx-glass { padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 14px 30px -18px rgba(0,0,0,.7); }
    .mx-h { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font: 1.05rem var(--marker); text-transform: uppercase; }
    .mx-h .n { margin-left: auto; font: 600 .78rem var(--kanit); text-transform: none; opacity: .75; }
    .mx-note { margin: 8px 0 0; font-size: .78rem; opacity: .75; line-height: 1.35; }
    .mx-small-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .mx-sb { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: #fff; font: 600 .82rem var(--kanit); cursor: pointer; text-decoration: none !important; }
    .mx-sb:hover { background: rgba(255,255,255,.16); }
    .mx-sb.on { background: #fff; color: var(--ink); }

    /* tracks */
    .mx-tracks { display: grid; gap: 10px; }
    .mx-tcard { --c1: #ff8a2a; --c2: #b8430c; position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 3px solid transparent; color: #fff; text-align: left; cursor: pointer; font: inherit;
      background: repeating-conic-gradient(from 0deg at 85% 140%, rgba(255,255,255,.07) 0 5deg, transparent 5deg 11deg), linear-gradient(135deg, var(--c1), var(--c2));
      box-shadow: 0 5px 0 rgba(0,0,0,.28), 0 14px 30px -14px rgba(0,0,0,.7); transition: transform .12s, border-color .15s; }
    .mx-tcard:hover { transform: translateY(-2px); }
    .mx-tcard.on { border-color: #fff; }
    .mx-tcard.desert { --c1: #f08a32; --c2: #b04a12; }
    .mx-tcard.forest { --c1: #4c9a3c; --c2: #24591f; }
    .mx-tcard.snow { --c1: #5aa6e8; --c2: #2b5fa8; }
    .mx-tcard.random { --c1: #8b5cf6; --c2: #4c1d95; }
    .mx-tcard .e { font-size: 1.8rem; grid-row: span 2; }
    .mx-tcard b { font: 1.35rem var(--marker); text-transform: uppercase; line-height: 1.05; }
    .mx-tcard .about { font-size: .76rem; opacity: .88; grid-column: 2 / 4; line-height: 1.25; }
    .mx-tcard .medal { font-size: 1.5rem; }
    .mx-tcard .times { grid-column: 1 / 4; display: flex; gap: 10px; flex-wrap: wrap; font: 600 .76rem var(--kanit); font-variant-numeric: tabular-nums; }
    .mx-tcard .times .best { padding: 1px 8px; border-radius: 6px; background: rgba(0,0,0,.25); }
    .mx-tcard:disabled { cursor: default; transform: none; }
    /* challenges: one row each (big on the challenges screen, compact in the room) */
    .mx-chlist { display: grid; gap: 8px; }
    .mx-chal { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 14px; border-radius: 14px; border: 3px solid transparent; color: #fff; text-align: left; cursor: pointer; font: inherit;
      background: linear-gradient(120deg, #e8641c, #9a2f0c); box-shadow: 0 3px 0 rgba(0,0,0,.35); transition: transform .12s; }
    .mx-chal:hover { transform: translateY(-2px); }
    .mx-chal.on { border-color: #fff; }
    .mx-chal:disabled { cursor: default; transform: none; }
    .mx-chal .e { font-size: 1.7rem; }
    .mx-chal .tx { display: grid; min-width: 0; }
    .mx-chal b { font: 1.2rem var(--marker); text-transform: uppercase; line-height: 1.05; }
    .mx-chal small { font: 600 .74rem var(--kanit); opacity: .9; }
    .mx-chal .ab { font-size: .76rem; opacity: .85; line-height: 1.25; margin-top: 3px; }
    .mx-chal .best { font: 600 .76rem var(--kanit); padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.28); white-space: nowrap; }
    .mx-glass .mx-chal { padding: 7px 10px; background: rgba(255,255,255,.08); box-shadow: none; }
    .mx-glass .mx-chal.on { background: linear-gradient(120deg, #e8641c, #9a2f0c); }
    .mx-glass .mx-seg { margin-bottom: 8px; }
    /* the free-ride engine shop */
    .mx-shop { display: grid; gap: 6px; }
    .mx-shoprow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.07); border: 2px solid transparent; }
    .mx-shoprow.on { border-color: var(--hi); }
    .mx-shoprow .e { font-size: 1.5rem; }
    .mx-shoprow .tx { display: grid; min-width: 0; }
    .mx-shoprow b { font: 1.05rem var(--marker); text-transform: uppercase; }
    .mx-shoprow small { font-size: .74rem; opacity: .8; line-height: 1.25; }
    .mx-shoprow .mx-sb { white-space: nowrap; }
    .mx-tchips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .mx-tchips .mx-tcard { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 9px 4px; gap: 2px; }
    .mx-tchips .mx-tcard .e { grid-row: auto; font-size: 1.4rem; }
    .mx-tchips .mx-tcard b { font-size: .82rem; }

    /* the online room */
    .mx-room { display: grid; grid-template-columns: minmax(0, 440px) 1fr minmax(260px, 340px); gap: 16px; width: 100%; align-items: start; }
    .mx-room .mx-chat { grid-column: 3; position: sticky; top: 0; height: min(560px, calc(100vh - 190px)); display: flex; flex-direction: column; }
    .mx-riders { display: grid; gap: 6px; }
    .mx-rider { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-radius: 10px; background: rgba(255,255,255,.07); font-weight: 600; cursor: default; }
    .mx-rider.me { box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); }
    .mx-rider.click { cursor: pointer; }
    .mx-rider .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mx-rider .nm small { opacity: .6; font-weight: 400; }
    .mx-rider .sw { flex: none; width: 28px; height: 15px; border-radius: 4px 9px 4px 4px; background: linear-gradient(135deg, var(--c1) 58%, var(--c2) 58% 74%, var(--c1) 74%); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
    .mx-rider .st { flex: none; padding: 1px 8px; border-radius: 6px; background: rgba(255,255,255,.12); font: .76rem var(--marker); }
    .mx-rider .st.ok { background: var(--hi); color: #13210a; }
    .mx-rider .st.off { opacity: .6; }
    .mx-results { display: grid; gap: 5px; }
    .mx-results .mx-rider .t { font: 800 italic .95rem var(--kanit); font-variant-numeric: tabular-nums; }
    .mx-chat .chat { min-height: 0; }
    .mx-chat .chat-log { min-height: 80px; }
    .mx-chat .chat-msg .bubble { background: rgba(255,255,255,.09); }
    .mx-chat .chat-form .input { background: rgba(0,0,0,.3); border-color: var(--line); color: #fff; }
    .mx-chat .panel-title { display: none; }
    .mx-joinrow { display: flex; gap: 8px; }
    .mx-joinrow .input { flex: 1; min-width: 0; background: rgba(21,23,28,.06); border: 2px solid rgba(21,23,28,.2); color: var(--ink); font: 1.4rem var(--marker); letter-spacing: .25em; text-transform: uppercase; text-align: center; padding: 8px; }
    .mx-joinrow .input::placeholder { color: rgba(21,23,28,.35); font-family: var(--marker); letter-spacing: .25em; }

    /* garage */
    .mx-liveries { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    .mx-livery { position: relative; display: grid; gap: 6px; justify-items: center; padding: 10px 6px 8px; border-radius: 12px; border: 2px solid var(--line); background: rgba(255,255,255,.06); color: #fff; font: 600 .74rem var(--kanit); cursor: pointer; line-height: 1.15; text-align: center; }
    .mx-livery:hover { background: rgba(255,255,255,.12); }
    .mx-livery i { width: 54px; height: 30px; border-radius: 10px 18px 8px 8px; background: linear-gradient(135deg, var(--c1) 55%, var(--c2) 55% 70%, var(--c1) 70%); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.3); }
    .mx-livery.on { border-color: #fff; background: rgba(255,255,255,.16); }
    .mx-livery.locked i { filter: grayscale(.7) brightness(.7); }
    .mx-livery .lk { position: absolute; top: 4px; right: 6px; font-size: .8rem; }
    .mx-livery .emo { display: grid; place-items: center; height: 30px; font-size: 1.6rem; }
    .mx-num { display: flex; gap: 8px; align-items: center; }
    .mx-num .mx-sb { width: 44px; height: 44px; justify-content: center; font-size: 1.3rem; }
    .mx-num .input { width: 90px; text-align: center; font: 1.8rem var(--marker); background: rgba(0,0,0,.3); color: #fff; border-color: var(--line); }

      <button id="mx-trials" hidden title="Mini races" aria-label="Mini races">🏁</button>
      <button id="mx-cam" title="Camera (C)" aria-label="Change camera">🎥</button>

    <div class="mx-touch" id="mx-touch">
      <div class="grp"><button data-k="left" aria-label="Steer left">◀</button><button data-k="right" aria-label="Steer right">▶</button></div>
      <div class="grp"><button data-k="brake" aria-label="Brake (hold to back up)">▼</button><button data-k="gas" aria-label="Gas">▲</button></div>

      <div class="grp"><button class="sm" data-k="back" aria-label="Lean back">⤺</button><button class="sm" data-k="fwd" aria-label="Lean forward">⤻</button><button class="sm" data-k="trick" aria-label="Superman trick">★</button><button class="sm" data-k="spin" aria-label="360 spin">↻</button></div>
      <div class="grp"><button class="sm" data-k="respawn" aria-label="Back to checkpoint">↺</button><button class="sm nitro" data-k="nitro" aria-label="Nitro">N₂O</button></div>
    </div>
