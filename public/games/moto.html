<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Motocross · Party Arcade</title>
  <meta name="description" content="Motocross: realistic 3D dirt bikes with huge jumps, flips and nitro. Ride solo time trials or race your friends online on Party Arcade.">
  <meta name="theme-color" content="#0b0920">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Kanit:ital,wght@1,600;1,800;1,900&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('pa_theme')) || 'neon'; } catch (e) { /* storage blocked */ }</script>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
  <style>
    .mx-wrap { width: min(1100px, 100%); margin: 0 auto; }
    /* menu */
    .tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .track-card { text-align: left; padding: 14px; border-radius: 18px; border: 2px solid var(--border); background: var(--panel); color: var(--text); font: inherit; cursor: pointer; display: grid; gap: 6px; transition: transform .12s, border-color .2s; }
    .track-card:hover { transform: translateY(-2px); border-color: var(--cyan); }
    .track-card.on { border-color: var(--yellow); background: rgba(250,204,21,.1); }
    .track-card:disabled { cursor: default; transform: none; }
    .track-card .tc-top { display: flex; align-items: center; gap: 8px; }
    .track-card .tc-e { font-size: 1.8rem; }
    .track-card b { font-size: 1.1rem; }
    .track-card .tc-about { font-size: .85rem; color: var(--muted); }
    .track-card .tc-best { font-size: .85rem; font-weight: 700; }
    .track-card .tc-medals { font-size: .78rem; color: var(--faint); font-variant-numeric: tabular-nums; }
    .mx-tc { background-size: cover; position: relative; overflow: hidden; }
    .mx-tc.mx-desert { background-image: linear-gradient(160deg, rgba(255,170,90,.22), transparent 60%); }
    .mx-tc.mx-forest { background-image: linear-gradient(160deg, rgba(60,180,90,.22), transparent 60%); }
    .mx-tc.mx-snow { background-image: linear-gradient(160deg, rgba(150,180,255,.25), transparent 60%); }
    .menu-head { text-align: center; margin-bottom: 16px; }
    .mx-garage { margin-top: 14px; }
    .mx-liveries { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 6px 0 8px; }
    .mx-livery { display: grid; gap: 6px; justify-items: center; padding: 10px 6px; border-radius: 14px; border: 2px solid var(--border); background: var(--panel); color: var(--text); font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer; }
    .mx-livery i { width: 54px; height: 30px; border-radius: 10px 18px 8px 8px; background: linear-gradient(135deg, var(--c1) 55%, var(--c2) 55% 70%, var(--c1) 70%); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.3); }
    .mx-livery.on { border-color: var(--yellow); background: rgba(250,204,21,.1); }
    .mx-livery.locked { opacity: .5; }
    .mx-opts { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 14px; font-weight: 600; }
    .mx-opts select { width: auto; display: inline-block; padding: 6px 10px; }
    .mx-keys { margin-top: 12px; text-align: center; color: var(--muted); font-size: .85rem; }
    .mx-ready { display: grid; gap: 6px; margin: 10px 0; }
    .mx-results { display: grid; gap: 6px; }
    .mx-room-tracks { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
    .mx-room-tracks .tc-about { display: none; }
    .mx-liveries.small { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
    .mx-liveries.small .mx-livery { padding: 8px 4px; font-size: .72rem; }

    /* the ride: full window, Cork7-style HUD */
    body.mx-riding { overflow: hidden; }
    body.mx-riding .topbar, body.mx-riding .site-footer, body.mx-riding .news { display: none !important; }
    #ride { position: fixed; inset: 0; z-index: 60; background: #0b1220; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    #ride.hidden { display: none; }
    #mx-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .mx-hud { position: absolute; inset: 0; pointer-events: none; color: #fff; font-family: 'Kanit', var(--font); font-style: italic; text-shadow: 0 2px 10px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.4); }
    .mx-tl { position: absolute; left: clamp(14px, 3vw, 34px); top: clamp(12px, 3vh, 30px); }
    .mx-track { font-family: 'Permanent Marker', 'Kanit', cursive; font-style: normal; font-size: clamp(1.4rem, 3.4vw, 2.4rem); letter-spacing: .02em; line-height: 1; text-transform: uppercase; transform: rotate(-2deg); }
    .mx-sub { margin-top: 6px; font-weight: 800; font-size: clamp(.7rem, 1.5vw, .9rem); letter-spacing: .12em; opacity: .9; }
    .mx-board { margin-top: 10px; display: grid; gap: 3px; font-style: normal; font-family: var(--font); }
    .mx-board div { display: flex; gap: 7px; align-items: center; padding: 2px 10px 2px 4px; border-radius: 999px; background: rgba(10,12,20,.45); font-weight: 700; font-size: .8rem; width: max-content; }
    .mx-board div.me { background: rgba(255,210,26,.85); color: #1a1300; text-shadow: none; }
    .mx-board i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .mx-tr { position: absolute; right: clamp(14px, 3vw, 34px); top: clamp(56px, 7vh, 64px); text-align: right; }
    .mx-lab { font-weight: 800; font-size: clamp(.65rem, 1.4vw, .82rem); letter-spacing: .2em; opacity: .9; }
    .mx-time { font-weight: 900; font-size: clamp(1.6rem, 4.4vw, 3.1rem); line-height: 1; font-variant-numeric: tabular-nums; }
    .mx-split { font-weight: 800; font-size: 1.1rem; margin-top: 2px; }
    .mx-split.good { color: #86efac; } .mx-split.bad { color: #fda4af; }
    .mx-br { position: absolute; right: clamp(14px, 3vw, 34px); bottom: clamp(14px, 4vh, 34px); text-align: right; }
    .mx-speed { font-weight: 900; font-size: clamp(2.6rem, 8vw, 5.6rem); line-height: .9; font-variant-numeric: tabular-nums; }
    .mx-speed small { font-size: .26em; letter-spacing: .1em; margin-left: 4px; font-weight: 800; }
    .mx-gear { display: inline-block; margin-top: 4px; min-width: 34px; padding: 1px 9px; border: 2px solid rgba(255,255,255,.8); border-radius: 9px; font-weight: 900; font-size: 1rem; text-align: center; }
    .mx-nitro { width: clamp(150px, 22vw, 230px); height: 9px; margin: 8px 0 0 auto; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
    .mx-nitro i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #38bdf8, #a5f3fc); transition: width .12s; }
    .mx-nitro.full i { background: linear-gradient(90deg, #38bdf8, #ffffff); box-shadow: 0 0 12px #7dd3fc; }
    .mx-nitro.on i { background: linear-gradient(90deg, #f97316, #fde047); }
    .mx-nlab { font-weight: 800; font-size: .7rem; letter-spacing: .2em; opacity: .85; margin-top: 4px; }
    .mx-bl { position: absolute; left: clamp(14px, 3vw, 34px); bottom: clamp(14px, 4vh, 34px); }
    #hud-map { width: clamp(150px, 22vw, 260px); height: auto; display: block; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
    .mx-left { font-weight: 800; font-size: clamp(.8rem, 1.7vw, 1rem); letter-spacing: .1em; margin-top: 4px; }
    .mx-btns { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 3; }
    .mx-btns button { width: 36px; height: 36px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(10,12,20,.4); color: #fff; font-size: 1rem; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .mx-center { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; padding: 16px; }
    .mx-count { font-family: 'Kanit', var(--font); font-style: italic; font-weight: 900; font-size: clamp(5rem, 18vw, 11rem); color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.4); animation: mxPop .9s ease-out forwards; }
    .mx-count.go { color: #fde047; }
    @keyframes mxPop { 0% { transform: scale(1.6); opacity: 0; } 15% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { transform: scale(.9); opacity: 0; } }
    .mx-loading { display: grid; justify-items: center; gap: 12px; color: #fff; font-weight: 700; }
    .mx-spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid rgba(255,255,255,.25); border-top-color: #fff; animation: mxSpin .8s linear infinite; }
    @keyframes mxSpin { to { transform: rotate(360deg); } }
    .mx-msg { position: absolute; left: 0; right: 0; top: 22%; text-align: center; pointer-events: none; font-family: 'Kanit', var(--font); font-style: italic; font-weight: 900; font-size: clamp(1.4rem, 4.4vw, 2.6rem); color: #fff; text-shadow: 0 3px 18px rgba(0,0,0,.45); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; }
    .mx-msg.on { opacity: 1; transform: none; }
    .mx-msg.bad { color: #fda4af; }
    .mx-msg.cp { color: #fde047; }
    .mx-msg.small { font-size: clamp(1rem, 2.6vw, 1.4rem); font-weight: 800; }
    .mx-trick { position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; opacity: 0; color: #fff; text-shadow: 0 3px 20px rgba(0,0,0,.45); }
    .mx-trick b { display: block; font-family: 'Permanent Marker', cursive; font-size: clamp(2rem, 7vw, 4.4rem); line-height: 1; transform: rotate(-3deg); }
    .mx-trick small { display: block; margin-top: 8px; font-family: 'Kanit', var(--font); font-style: italic; font-weight: 800; letter-spacing: .14em; font-size: clamp(.8rem, 2vw, 1.1rem); color: #7dd3fc; }
    .mx-trick.on { animation: mxTrick 1.6s ease-out forwards; }
    @keyframes mxTrick { 0% { opacity: 0; transform: scale(1.4); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
    .mx-card { pointer-events: auto; max-width: min(470px, 94%); padding: 20px 22px; border-radius: 22px; background: rgba(16,14,40,.9); border: 1px solid var(--border-strong); box-shadow: var(--shadow); text-align: center; color: var(--text); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .mx-card h2 { font-family: var(--font-display); font-weight: 400; margin: 0 0 4px; }
    .mx-big { font-family: 'Kanit', var(--font); font-style: italic; font-weight: 900; font-size: clamp(2.2rem, 7vw, 3.2rem); margin: 4px 0; }
    .mx-medal { font-size: 3rem; }
    .mx-stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 8px 0; font-weight: 700; font-size: .9rem; }
    .mx-card .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .mx-card .rows { display: grid; gap: 4px; text-align: left; margin-top: 10px; }
    .mx-card .rows div { display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 10px; background: rgba(255,255,255,.05); font-weight: 600; }
    .mx-card .rows .grow { flex: 1; }
    /* touch controls */
    .mx-touch { position: absolute; left: 0; right: 0; bottom: 14px; display: none; justify-content: space-between; padding: 0 14px; pointer-events: none; z-index: 2; }
    .mx-touch .grp { display: flex; gap: 10px; pointer-events: auto; align-items: flex-end; }
    .mx-touch button { width: 66px; height: 66px; border-radius: 20px; border: 2px solid rgba(255,255,255,.4); background: rgba(10,12,20,.4); color: #fff; font-size: 1.5rem; font-weight: 800; touch-action: none; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .mx-touch button.on { background: rgba(255,255,255,.35); }
    .mx-touch button.sm { width: 48px; height: 48px; font-size: 1.1rem; }
    .mx-touch button.nitro { border-color: #7dd3fc; color: #a5f3fc; }
    @media (pointer: coarse) { .mx-touch { display: flex; } .mx-br { bottom: 96px; } .mx-bl { bottom: 96px; } }
    @media (max-width: 600px) { .mx-tl { top: 58px; } .mx-tr { top: 58px; } }
    @media (max-width: 480px) {
      .mx-touch { padding: 0 8px; }
      .mx-touch .grp { gap: 6px; }
      .mx-touch button { width: 58px; height: 58px; font-size: 1.3rem; border-radius: 18px; }
      .mx-touch button.sm { width: 42px; height: 42px; font-size: 1rem; border-radius: 14px; }
      .mx-btns button { width: 34px; height: 34px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div id="entry"></div>
    <section id="room" class="hidden room-layout">
      <div class="col">
        <div class="panel" id="room-code"></div>
        <div class="panel" id="room-players"></div>
      </div>
      <div class="panel room-main" id="room-main"></div>
      <div class="panel chat-panel" id="room-chat"></div>
    </section>
    <section id="menu" class="hidden mx-wrap"></section>
  </main>
  <section id="ride" class="hidden">
    <canvas id="mx-canvas"></canvas>
    <div class="mx-hud">
      <div class="mx-tl"><div class="mx-track" id="hud-track"></div><div class="mx-sub" id="hud-sub"></div><div class="mx-board" id="hud-board"></div></div>
      <div class="mx-tr"><div class="mx-lab">TIME</div><div class="mx-time" id="hud-time">0:00.00</div><div class="mx-split" id="hud-split"></div></div>
      <div class="mx-bl"><canvas id="hud-map" width="520" height="130"></canvas><div class="mx-left" id="hud-left"></div></div>
      <div class="mx-br"><div class="mx-lab">SPEED</div><div class="mx-speed"><span id="hud-speed">0</span><small>KM/H</small></div><div class="mx-gear" id="hud-gear">1</div><div class="mx-nitro"><i id="hud-nitro"></i></div><div class="mx-nlab">NITRO</div></div>
      <div class="mx-msg" id="hud-msg"></div>
      <div class="mx-trick" id="hud-trick"></div>
    </div>
    <div class="mx-center" id="hud-center"></div>
    <div class="mx-btns">
      <button id="mx-quit" title="Back (Esc)" aria-label="Back">✕</button>
      <button id="mx-full" title="Full screen" aria-label="Full screen">⛶</button>
      <button id="mx-mute" title="Sound on/off (M)" aria-label="Sound on or off">🔊</button>
      <button id="mx-cam" title="Camera (C)" aria-label="Change camera">🎥</button>
    </div>
    <div class="mx-touch" id="mx-touch">
      <div class="grp"><button data-k="back" aria-label="Lean back">⤺</button><button data-k="fwd" aria-label="Lean forward">⤻</button><button class="sm" data-k="respawn" aria-label="Back to checkpoint">↺</button></div>
      <div class="grp"><button class="sm nitro" data-k="nitro" aria-label="Nitro">N₂O</button><button data-k="brake" aria-label="Brake">⏪</button><button data-k="gas" aria-label="Gas">⏩</button></div>
    </div>
  </section>
  <script src="/js/art.js"></script>
  <script src="/js/core.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/lobby.js"></script>
  <script src="/js/games/moto/core.js"></script>
  <script type="module" src="/js/games/moto/game.js"></script>
</body>
</html>
